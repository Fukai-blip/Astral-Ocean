      function getSolarSystemOuterBoundary() {
        const sun = getStarById('star-sun') || appState.data.stars[0];
        const sunPlanets = sun ? getPlanetsForStar(sun.id) : [];
        let maxOuter = 225;
        sunPlanets.forEach((p) => {
          const outer = Number(p.orbitRadius || 0) + Number(p.radius || 0) + 42;
          if (outer > maxOuter) maxOuter = outer;
        });
        return maxOuter;
      }

      function enforceStarExclusionRule(rawPos, ignoreStarId = null, notifyIfAdjusted = false) {
        const sun = getStarById('star-sun') || appState.data.stars[0];
        const sunPos = sun && sun.position ? sun.position : { x: 0, y: 0, z: 0 };
        const minSolarDist = getSolarSystemOuterBoundary();

        let x = Number(rawPos && rawPos.x) || 0;
        let y = Number(rawPos && rawPos.y) || 0;
        let z = Number(rawPos && rawPos.z) || 0;
        let adjusted = false;

        if (!sun || sun.id !== ignoreStarId) {
          const dxSun = x - (sunPos.x || 0);
          const dySun = y - (sunPos.y || 0);
          const dzSun = z - (sunPos.z || 0);
          const distSun3D = Math.hypot(dxSun, dySun, dzSun);
          if (distSun3D < minSolarDist) {
            const horizDist = Math.hypot(dxSun, dzSun);
            const angle = horizDist > 1e-4 ? Math.atan2(dzSun, dxSun) : (appState.data.stars.length + 1) * 1.15;
            const elevation = distSun3D > 1e-4 ? Math.asin(clampVal(dySun / distSun3D, -0.85, 0.85)) : 0.42;
            const cosEl = Math.cos(elevation);
            x = Math.round((sunPos.x || 0) + Math.cos(angle) * minSolarDist * cosEl);
            y = Math.round((sunPos.y || 0) + Math.sin(elevation) * minSolarDist);
            z = Math.round((sunPos.z || 0) + Math.sin(angle) * minSolarDist * cosEl);
            adjusted = true;
          }
          if (Math.abs(y - (sunPos.y || 0)) < 55) {
            const signY = y >= (sunPos.y || 0) ? 1 : -1;
            y = Math.round((sunPos.y || 0) + signY * (75 + ((appState.data.stars.length % 3) * 35)));
            adjusted = true;
          }
        }

        for (let pass = 0; pass < 4; pass++) {
          let collided = false;
          for (const other of appState.data.stars) {
            if (other.id === ignoreStarId) continue;
            const op = other.position || { x: 0, y: 0, z: 0 };
            const clearance = other.id === 'star-sun' ? minSolarDist : (Number(other.radius) || 14) + 120;
            const dx = x - (op.x || 0);
            const dy = y - (op.y || 0);
            const dz = z - (op.z || 0);
            const d = Math.hypot(dx, dy, dz);
            if (d < clearance) {
              const ang = Math.hypot(dx, dz) > 1e-4 ? Math.atan2(dz, dx) : (pass + 1) * 1.57;
              x = Math.round((op.x || 0) + Math.cos(ang) * clearance);
              z = Math.round((op.z || 0) + Math.sin(ang) * clearance);
              collided = true;
              adjusted = true;
            }
          }
          if (!collided) break;
        }

        if (adjusted && notifyIfAdjusted) {
          showToast('太陽系外縁の立体安全領域へ座標を調整しました', 'ph-shield-warning');
        }

        return { x: Math.round(x), y: Math.round(y), z: Math.round(z) };
      }

      function findSafeStarSpawnPosition() {
        const sun = getStarById('star-sun') || appState.data.stars[0];
        const sunPos = sun && sun.position ? sun.position : { x: 0, y: 0, z: 0 };
        const minSolarDist = getSolarSystemOuterBoundary();
        const idx = appState.data.stars.length + 1;

        for (let attempt = 0; attempt < 48; attempt++) {
          const ring = Math.floor(attempt / 8);
          const angle = idx * 1.35 + attempt * 0.78;
          const signY = ((idx + attempt) % 2 === 0) ? 1 : -1;
          const elevationDeg = 24 + ((idx * 13 + attempt * 11) % 35);
          const elevationRad = signY * (elevationDeg * Math.PI) / 180;
          const dist3D = minSolarDist + 55 + ring * 95;
          const horizDist = Math.cos(elevationRad) * dist3D;

          const candidate = {
            x: Math.round((sunPos.x || 0) + Math.cos(angle) * horizDist),
            y: Math.round((sunPos.y || 0) + Math.sin(elevationRad) * dist3D),
            z: Math.round((sunPos.z || 0) + Math.sin(angle) * horizDist)
          };

          const tooCloseToStar = appState.data.stars.some((s) => {
            const sp = s.position || { x: 0, y: 0, z: 0 };
            const d = Math.hypot(candidate.x - (sp.x || 0), candidate.y - (sp.y || 0), candidate.z - (sp.z || 0));
            const requiredClearance = s.id === 'star-sun' ? minSolarDist : (Number(s.radius) || 14) + 120;
            return d < requiredClearance;
          });

          const insideAnyOrbit = appState.data.planets.some((p) => {
            const pStar = getStarById(p.starId) || sun;
            const center = pStar && pStar.position ? pStar.position : { x: 0, y: 0, z: 0 };
            const d = Math.hypot(candidate.x - (center.x || 0), candidate.y - (center.y || 0), candidate.z - (center.z || 0));
            return d < Number(p.orbitRadius || 0) + 38;
          });

          if (!tooCloseToStar && !insideAnyOrbit) {
            return enforceStarExclusionRule(candidate, null, false);
          }
        }

        const fallbackSign = idx % 2 === 0 ? 1 : -1;
        return enforceStarExclusionRule(
          {
            x: (sunPos.x || 0) + minSolarDist + 80,
            y: (sunPos.y || 0) + fallbackSign * 145,
            z: (sunPos.z || 0) + 65
          },
          null,
          false
        );
      }

        if (appState.data.selectedKind === 'planet') {

            const starOptionsHtml = appState.data.stars

            container.innerHTML = `

                </div>
                <div>
                  <label class="block text-[11px] text-zinc-400 mb-1">惑星カラー</label>

                    <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-black/65 text-white">${escapeHtml((planet.color || '#38bdf8').toUpperCase())}</span>
                    <i class="ph ph-sliders-horizontal text-xs text-white drop-shadow"></i>
                  </button>
                </div>
              </div>

            ${star.id !== 'star-sun' ? `

        onEl(container.querySelector('#inspStarName'), 'focus', () => pushUndoCheckpoint());
        onEl(container.querySelector('#inspStarName'), 'input', (e) => {
          star.name = e.target.value;

          updateLockStatusUI();

        onEl(container.querySelector('#inspStarColorTrigger'), 'click', () => {

        onEl(container.querySelector('#inspStarRadius'), 'pointerdown', () => pushUndoCheckpoint());
        onEl(container.querySelector('#inspStarRadius'), 'input', (e) => {
          star.radius = Number(e.target.value);
          const valEl = container.querySelector('#inspStarRadiusVal');
          if (valEl) valEl.textContent = star.radius.toFixed(1);
          rebuild3DScene();
          saveStateToLocalStorage(false);
        });
        const applyStarCoords = () => {
          if (star.id === 'star-sun') return;
          pushUndoCheckpoint();
          const xInput = container.querySelector('#inspStarPosX');
          const yInput = container.querySelector('#inspStarPosY');
          const zInput = container.querySelector('#inspStarPosZ');
          const nextPos = enforceStarExclusionRule(
            {

              y: Number(yInput ? yInput.value : pos.y || 0),

          );
          star.position = nextPos;
          if (xInput) xInput.value = String(nextPos.x);
          if (yInput) yInput.value = String(nextPos.y);
          if (zInput) zInput.value = String(nextPos.z);
          rebuild3DScene();
          saveStateToLocalStorage(true);
        };
        onEl(container.querySelector('#inspStarPosX'), 'change', applyStarCoords);
        onEl(container.querySelector('#inspStarPosY'), 'change', applyStarCoords);
        onEl(container.querySelector('#inspStarPosZ'), 'change', applyStarCoords);
        onEl(container.querySelector('#inspStarNote'), 'focus', () => pushUndoCheckpoint());
        onEl(container.querySelector('#inspStarNote'), 'input', (e) => {

          saveStateToLocalStorage(false);

        if (delStarBtn) {
          onEl(delStarBtn, 'click', () => {

          });

      }

      const colorPopoverState = {
        open: false,
        mode: 'sliders',
        targetKind: null,
        targetId: null,
        rgb: { r: 245, g: 158, b: 11 }
      };

      function normalizeHex6(hexStr, fallback = '#f59e0b') {
        const cleaned = String(hexStr || '').trim().replace(/^#/, '');
        if (/^[0-9a-fA-F]{3}$/.test(cleaned)) {
          return '#' + cleaned.split('').map((ch) => ch + ch).join('').toLowerCase();
        }
        if (/^[0-9a-fA-F]{6}$/.test(cleaned)) {
          return '#' + cleaned.toLowerCase();
        }
        return fallback.toLowerCase();
      }

      function hexToRgb(hexStr) {
        const norm = normalizeHex6(hexStr, '#f59e0b').slice(1);
        return {
          r: parseInt(norm.slice(0, 2), 16),
          g: parseInt(norm.slice(2, 4), 16),
          b: parseInt(norm.slice(4, 6), 16)
        };
      }

      function rgbToHex(r, g, b) {
        const toHex = (n) => Math.max(0, Math.min(255, Math.round(Number(n) || 0))).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toLowerCase();
      }

      function getActiveColorTargetEntity() {
        if (colorPopoverState.targetKind === 'planet') {
          return getPlanetById(colorPopoverState.targetId);
        }
        if (colorPopoverState.targetKind === 'star') {
          return getStarById(colorPopoverState.targetId);
        }
        if (appState.data.selectedKind === 'planet') {
          return getPlanetById(appState.data.selectedId);
        }
        return getStarById(appState.data.selectedId) || appState.data.stars[0] || null;
      }

      function applyColorToTarget(nextHex, recordHistory = false) {
        const hex = normalizeHex6(nextHex, '#f59e0b');
        const rgb = hexToRgb(hex);
        colorPopoverState.rgb = rgb;

        const target = getActiveColorTargetEntity();
        if (target) {
          if (recordHistory) pushUndoCheckpoint();
          target.color = hex;
          if (colorPopoverState.targetKind === 'planet' || (!colorPopoverState.targetKind && appState.data.selectedKind === 'planet')) {
            colorPopoverState.targetKind = 'planet';
            colorPopoverState.targetId = target.id;
          } else {
            colorPopoverState.targetKind = 'star';
            colorPopoverState.targetId = target.id;
          }
          rebuild3DScene();
          renderExplorer();
          saveStateToLocalStorage(recordHistory);
        }

        syncColorPopoverUI(hex, rgb);
      }

      function syncColorPopoverUI(hex = null, rgb = null) {
        const resolvedRgb = rgb || colorPopoverState.rgb;
        const resolvedHex = normalizeHex6(hex || rgbToHex(resolvedRgb.r, resolvedRgb.g, resolvedRgb.b));

        if (els.colorValR) els.colorValR.textContent = String(resolvedRgb.r);
        if (els.colorValG) els.colorValG.textContent = String(resolvedRgb.g);
        if (els.colorValB) els.colorValB.textContent = String(resolvedRgb.b);

        if (els.colorSliderR) {
          els.colorSliderR.value = String(resolvedRgb.r);
          els.colorSliderR.style.background = `linear-gradient(90deg, rgb(0, ${resolvedRgb.g}, ${resolvedRgb.b}) 0%, rgb(255, ${resolvedRgb.g}, ${resolvedRgb.b}) 100%)`;
        }
        if (els.colorSliderG) {
          els.colorSliderG.value = String(resolvedRgb.g);
          els.colorSliderG.style.background = `linear-gradient(90deg, rgb(${resolvedRgb.r}, 0, ${resolvedRgb.b}) 0%, rgb(${resolvedRgb.r}, 255, ${resolvedRgb.b}) 100%)`;
        }
        if (els.colorSliderB) {
          els.colorSliderB.value = String(resolvedRgb.b);
          els.colorSliderB.style.background = `linear-gradient(90deg, rgb(${resolvedRgb.r}, ${resolvedRgb.g}, 0) 0%, rgb(${resolvedRgb.r}, ${resolvedRgb.g}, 255) 100%)`;
        }

        if (els.colorHexInput && document.activeElement !== els.colorHexInput) {
          els.colorHexInput.value = resolvedHex.slice(1).toUpperCase();
        }
        if (els.colorActiveSwatch) {
          els.colorActiveSwatch.style.backgroundColor = resolvedHex;
        }

        const triggerBtn = els.inspectorContent
          ? els.inspectorContent.querySelector('#inspPlanetColorTrigger, #inspStarColorTrigger')
          : null;
        if (triggerBtn) {
          triggerBtn.style.backgroundColor = resolvedHex;
          const labelSpan = triggerBtn.querySelector('span');
          if (labelSpan) labelSpan.textContent = resolvedHex.toUpperCase();
        }
      }

      function populateColorGridIfNeeded() {
        if (!els.colorViewGrid || els.colorViewGrid.dataset.populated === '1') return;
        const gridPalette = [
          '#f8fafc', '#e2e8f0', '#94a3b8', '#475569', '#1e293b', '#09090b',
          '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e',
          '#10b981', '#14b8a6', '#06b6d4', '#38bdf8', '#3b82f6', '#6366f1',
          '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e', '#fb7185'
        ];
        els.colorViewGrid.innerHTML = gridPalette
          .map((hex) => `<button type="button" data-grid-hex="${hex}" class="h-6 w-full rounded-md border border-white/15 transition hover:scale-105" style="background-color:${hex}"></button>`)
          .join('');
        els.colorViewGrid.dataset.populated = '1';
      }

      function setColorPopoverMode(mode) {
        colorPopoverState.mode = mode;
        els.colorModeBtns.forEach((btn) => {
          const active = btn.dataset.colorMode === mode;
          btn.className = active
            ? 'color-mode-btn rounded-md py-1 bg-zinc-700/90 text-zinc-100 transition'
            : 'color-mode-btn rounded-md py-1 text-zinc-400 hover:text-zinc-200 transition';
        });
        if (els.colorViewSliders) els.colorViewSliders.classList.toggle('hidden', mode !== 'sliders');
        if (els.colorViewGrid) els.colorViewGrid.classList.toggle('hidden', mode !== 'grid');
        if (els.colorViewSpectrum) els.colorViewSpectrum.classList.toggle('hidden', mode !== 'spectrum');
        if (mode === 'grid') populateColorGridIfNeeded();
      }

      function openColorPopoverForTarget(kind, id) {
        const entity = kind === 'planet' ? getPlanetById(id) : getStarById(id);
        colorPopoverState.targetKind = kind;
        colorPopoverState.targetId = entity ? entity.id : null;
        const currentHex = normalizeHex6((entity && entity.color) || '#f59e0b');
        colorPopoverState.rgb = hexToRgb(currentHex);
        colorPopoverState.open = true;
        if (els.colorPickerPopover) {
          els.colorPickerPopover.classList.remove('hidden');
        }
        setColorPopoverMode(colorPopoverState.mode);
        syncColorPopoverUI(currentHex, colorPopoverState.rgb);
      }

      function closeColorPopover() {
        colorPopoverState.open = false;
        if (els.colorPickerPopover) {
          els.colorPickerPopover.classList.add('hidden');
        }
      }

      function toggleColorPopoverForTarget(kind, id) {
        if (
          colorPopoverState.open &&
          colorPopoverState.targetKind === kind &&
          colorPopoverState.targetId === id
        ) {
          closeColorPopover();
        } else {
          openColorPopoverForTarget(kind, id);
        }
      }

      function openBlackHoleModal(kind, id) {
        if (kind === 'planet') {
          const planet = getPlanetById(id);
          if (!planet) return;
          appState.blackHoleTarget = { kind: 'planet', id: planet.id };
          if (els.blackHoleTargetName) {
            els.blackHoleTargetName.textContent = `惑星ファイル: ${planet.name}`;
          }
          if (els.blackHoleDescription) {
            els.blackHoleDescription.textContent = `「${planet.name}」をブラックホールへ消去します。この操作は元に戻せません。`;
          }
          setModalVisibility(els.blackHoleModal, true);
        } else if (kind === 'star') {
          const star = getStarById(id);
          if (!star || star.id === 'star-sun') return;
          const childCount = getPlanetsForStar(star.id).length;
          appState.blackHoleTarget = { kind: 'star', id: star.id };
          if (els.blackHoleTargetName) {
            els.blackHoleTargetName.textContent = `恒星系: ${star.name}`;
          }
          if (els.blackHoleDescription) {
            els.blackHoleDescription.textContent = `恒星系「${star.name}」と所属する惑星（${childCount}個）をブラックホールへ消去します。この操作は元に戻せません。`;
          }
          setModalVisibility(els.blackHoleModal, true);
        }
      }

      function closeBlackHoleModal() {
        appState.blackHoleTarget = null;
        setModalVisibility(els.blackHoleModal, false);
      }

      function confirmBlackHoleDeletion() {
        const target = appState.blackHoleTarget;
        if (!target) return;

        if (target.kind === 'planet') {
          pushUndoCheckpoint();
          appState.data.planets = appState.data.planets.filter((p) => p.id !== target.id);
          appState.data.expandedPlanetIds = appState.data.expandedPlanetIds.filter((pid) => pid !== target.id);
          if (appState.data.selectedKind === 'planet' && appState.data.selectedId === target.id) {
            appState.data.selectedKind = 'star';
            appState.data.selectedId = appState.data.stars[0] ? appState.data.stars[0].id : null;
          }
          if (appState.data.lockedTarget && appState.data.lockedTarget.kind === 'planet' && appState.data.lockedTarget.id === target.id) {
            appState.data.lockedTarget = null;
          }
          showToast('惑星ファイルをブラックホールへ消去しました', 'ph-trash');
        } else if (target.kind === 'star') {
          if (target.id === 'star-sun') {
            closeBlackHoleModal();
            return;
          }
          pushUndoCheckpoint();
          const removedPlanetIds = new Set(
            appState.data.planets.filter((p) => p.starId === target.id).map((p) => p.id)
          );
          appState.data.stars = appState.data.stars.filter((s) => s.id !== target.id);
          appState.data.planets = appState.data.planets.filter((p) => p.starId !== target.id);
          appState.data.collapsedStarIds = (appState.data.collapsedStarIds || []).filter((sid) => sid !== target.id);
          appState.data.expandedPlanetIds = (appState.data.expandedPlanetIds || []).filter((pid) => !removedPlanetIds.has(pid));
          if (appState.data.selectedKind === 'star' && appState.data.selectedId === target.id) {
            appState.data.selectedKind = 'star';
            appState.data.selectedId = appState.data.stars[0] ? appState.data.stars[0].id : null;
          } else if (appState.data.selectedKind === 'planet' && removedPlanetIds.has(appState.data.selectedId)) {
            appState.data.selectedKind = 'star';
            appState.data.selectedId = appState.data.stars[0] ? appState.data.stars[0].id : null;
          }
          if (
            appState.data.lockedTarget &&
            ((appState.data.lockedTarget.kind === 'star' && appState.data.lockedTarget.id === target.id) ||
              (appState.data.lockedTarget.kind === 'planet' && removedPlanetIds.has(appState.data.lockedTarget.id)))
          ) {
            appState.data.lockedTarget = null;
          }
          showToast('恒星系をブラックホールへ消去しました', 'ph-trash');
        }

        closeBlackHoleModal();
        reconcileSelection();
        rebuild3DScene();
        renderAllUI();
        saveStateToLocalStorage(true);
      }

      function addNewStarSystem() {
        try {
          pushUndoCheckpoint();
          const idx = appState.data.stars.length + 1;
          const palette = ['#f59e0b', '#38bdf8', '#a855f7', '#34d399', '#fb7185', '#eab308'];
          const color = palette[(idx - 1) % palette.length];
          const safePos = findSafeStarSpawnPosition();
          const newStar = {
            id: `star-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: `系外恒星 #${idx}`,
            color,
            radius: 14,
            position: safePos,
            orbitSpeedMultiplier: 1.0,
            note: '新規追加された幾何学恒星系フォルダです。'
          };
          appState.data.stars.push(newStar);
          appState.data.selectedKind = 'star';
          appState.data.selectedId = newStar.id;
          appState.data.lockedTarget = { kind: 'star', id: newStar.id };
          rebuild3DScene();
          renderAllUI();
          saveStateToLocalStorage(true);

      function generateNonParallelOrbitAngles(starId) {
        const isSun = starId === 'star-sun';
        const signX = Math.random() < 0.5 ? -1 : 1;
        const signZ = Math.random() < 0.5 ? -1 : 1;
        const degX = isSun ? (16 + Math.random() * 34) : (24 + Math.random() * 46);
        const degZ = isSun ? (10 + Math.random() * 28) : (18 + Math.random() * 44);
        return {
          inclination: Number((0.08 + Math.random() * 0.28).toFixed(3)),
          orbitTiltX: Number((signX * (degX * Math.PI) / 180).toFixed(3)),
          orbitTiltZ: Number((signZ * (degZ * Math.PI) / 180).toFixed(3))
        };
      }

      // 黒背景の空間で視認しやすい高彩度〜明度のランダムカラー（16進数6桁）を生成
      function generateRandomPlanetColor() {
        const hue = Math.floor(Math.random() * 360);
        const sat = (74 + Math.random() * 22) / 100;
        const light = (54 + Math.random() * 18) / 100;

        const c = (1 - Math.abs(2 * light - 1)) * sat;
        const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
        const m = light - c / 2;

        let r1 = 0;
        let g1 = 0;
        let b1 = 0;
        if (hue < 60) {
          r1 = c;
          g1 = x;
        } else if (hue < 120) {
          r1 = x;
          g1 = c;
        } else if (hue < 180) {
          g1 = c;
          b1 = x;
        } else if (hue < 240) {
          g1 = x;
          b1 = c;
        } else if (hue < 300) {
          r1 = x;
          b1 = c;
        } else {
          r1 = c;
          b1 = x;
        }

        return rgbToHex((r1 + m) * 255, (g1 + m) * 255, (b1 + m) * 255);
      }

      function createPlanetRecord({ name, starId, type, radius, orbitRadius, imageUrl, contentHtml }) {
        pushUndoCheckpoint();
        const star = getStarById(starId) || appState.data.stars[0];
        const targetStarId = star ? star.id : 'star-sun';
        const normalizedType = type === 'image' ? 'image' : 'document';
        const randomColor = generateRandomPlanetColor();
        const safeName = String(name || '').trim() || (normalizedType === 'image' ? '新規画像.png' : '新規メモ.md');
        const orbitAngles = generateNonParallelOrbitAngles(targetStarId);
        // 25% の確率で網目状の惑星リングを生成
        const hasRing = Math.random() < 0.25;
        const planet = {
          id: `planet-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          starId: targetStarId,
          name: safeName,
          type: normalizedType,
          color: randomColor,
          hasRing,
          radius: Number(radius) || 3.8,
          orbitRadius: Number(orbitRadius) || 48,
          orbitSpeed: 0.24,
          orbitAngle: Math.random() * Math.PI * 2,
          inclination: orbitAngles.inclination,
          orbitTiltX: orbitAngles.orbitTiltX,
          orbitTiltZ: orbitAngles.orbitTiltZ,
          contentHtml: normalizedType === 'document' ? (contentHtml || `<h1>${escapeHtml(safeName)}</h1><p>新しい幾何学惑星ドキュメントです。</p>`) : '',
          imageUrl: normalizedType === 'image' ? (imageUrl || createDefaultSampleImageDataUrl(safeName, '#09090b', randomColor)) : '',
          updatedAt: Date.now()
        };
        appState.data.planets.push(planet);
        appState.data.selectedKind = 'planet';
        appState.data.selectedId = planet.id;
        appState.data.lockedTarget = { kind: 'planet', id: planet.id };
        rebuild3DScene();
        renderAllUI();
        saveStateToLocalStorage(true);
        return planet;
      }

      function handleLocalFilesSelected(fileList) {
        if (!fileList || fileList.length === 0) return;
        const targetStar = getStarById(appState.data.selectedId) || appState.data.stars[0];
        const baseOrbit = 36 + getPlanetsForStar(targetStar ? targetStar.id : 'star-sun').length * 14;

        Array.from(fileList).forEach((file, idx) => {
          const isImg = /^image\//i.test(file.type) || /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name);
          const orbitR = Math.min(235, baseOrbit + idx * 14);
          if (isImg) {
            const reader = new FileReader();
            reader.onload = () => {
              createPlanetRecord({
                name: file.name,
                starId: targetStar ? targetStar.id : 'star-sun',
                type: 'image',
                radius: 4.5,
                orbitRadius: orbitR,
                imageUrl: String(reader.result || '')
              });
              showToast(`画像「${file.name}」を惑星として配置しました`, 'ph-image');
            };
            reader.readAsDataURL(file);
          } else {
            const reader = new FileReader();
            reader.onload = () => {
              const textContent = String(reader.result || '');
              const htmlBody = textContent
                .split(/\r?\n/)
                .filter((line) => line.trim() !== '')
                .map((line) => `<p>${escapeHtml(line)}</p>`)
                .join('');
              createPlanetRecord({
                name: file.name,
                starId: targetStar ? targetStar.id : 'star-sun',
                type: 'document',
                radius: 3.6,
                orbitRadius: orbitR,
                contentHtml: `<h1>${escapeHtml(file.name)}</h1>${htmlBody || '<p></p>'}`
              });
              showToast(`文書「${file.name}」を惑星として配置しました`, 'ph-file-text');
            };
            reader.readAsText(file);
          }
        });
      }

          const h = Number(els.colorSpectrumHue ? els.colorSpectrumHue.value : 38);

          const s = 0.88;
          const c = (1 - Math.abs(2 * l - 1)) * s;
          const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
          const m = l - c / 2;
          let r1 = 0, g1 = 0, b1 = 0;
          if (h < 60) { r1 = c; g1 = x; }
          else if (h < 120) { r1 = x; g1 = c; }
          else if (h < 180) { g1 = c; b1 = x; }
          else if (h < 240) { g1 = x; b1 = c; }
          else if (h < 300) { r1 = x; b1 = c; }
          else { r1 = c; b1 = x; }
          applyColorToTarget(

          setCameraDistance(DEFAULT_CAMERA_DISTANCE, true);
        });

        onEl(els.tabStarTree, 'click', () => {
          appState.data.explorerTab = 'tree';
          renderExplorer();
          saveStateToLocalStorage(false);
        });
        onEl(els.tabAllFiles, 'click', () => {
          appState.data.explorerTab = 'all';
          renderExplorer();
          saveStateToLocalStorage(false);
        });
        els.typeFilterBtns.forEach((btn) => {
          onEl(btn, 'click', () => {
            appState.data.typeFilter = btn.dataset.typeFilter || 'all';
            renderExplorer();
            saveStateToLocalStorage(false);
          });
        });

        onEl(els.btnCloseNewPlanetModal, 'click', closeNewPlanetModal);
        onEl(els.btnCancelNewPlanet, 'click', closeNewPlanetModal);
        onEl(els.newPlanetRadius, 'input', (e) => {
          if (els.newPlanetRadiusValue) els.newPlanetRadiusValue.textContent = Number(e.target.value).toFixed(1);
        });
        onEl(els.newPlanetOrbit, 'input', (e) => {
          if (els.newPlanetOrbitValue) els.newPlanetOrbitValue.textContent = String(Math.round(Number(e.target.value)));
        });
        onEl(els.newPlanetType, 'change', (e) => {
          const isImg = e.target.value === 'image';
          if (els.newPlanetImageSection) els.newPlanetImageSection.classList.toggle('hidden', !isImg);
        });
        onEl(els.btnPickNewPlanetImageFile, 'click', () => {
          if (els.newPlanetImageFile) els.newPlanetImageFile.click();
        });
        onEl(els.newPlanetImageFile, 'change', (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          if (els.newPlanetImageFileName) els.newPlanetImageFileName.textContent = f.name;
          const reader = new FileReader();
          reader.onload = () => {
            if (els.newPlanetImageUrl) els.newPlanetImageUrl.value = String(reader.result || '');
          };
          reader.readAsDataURL(f);
        });

        onEl(els.newPlanetForm, 'submit', (e) => {
          e.preventDefault();
          const name = els.newPlanetName ? els.newPlanetName.value.trim() : '';
          if (!name) return;
          const starId = els.newPlanetStar ? els.newPlanetStar.value : 'star-sun';
          const pType = els.newPlanetType ? els.newPlanetType.value : 'document';
          const radius = els.newPlanetRadius ? Number(els.newPlanetRadius.value) : 3.8;
          const orbitRadius = els.newPlanetOrbit ? Number(els.newPlanetOrbit.value) : 48;
          const imageUrl = els.newPlanetImageUrl ? els.newPlanetImageUrl.value.trim() : '';

          const created = createPlanetRecord({
            name,
            starId,
            type: pType,
            radius,
            orbitRadius,
            imageUrl
          });
          closeNewPlanetModal();
          showToast(`惑星「${created.name}」を軌道に配置しました`, 'ph-planet');
        });

        onEl(els.btnCancelBlackHole, 'click', closeBlackHoleModal);
        onEl(els.btnConfirmBlackHole, 'click', confirmBlackHoleDeletion);

        onEl(els.btnSaveAndCloseDoc, 'click', () => saveActiveDoc(true));
        onEl(els.astralDocEditor, 'input', () => {
          if (els.docSaveIndicator) els.docSaveIndicator.textContent = '編集中...';
          if (appState.docAutoSaveTimerId) clearTimeout(appState.docAutoSaveTimerId);
          appState.docAutoSaveTimerId = setTimeout(() => saveActiveDoc(false), 600);
        });
        els.docCmdBtns.forEach((btn) => {
          onEl(btn, 'click', () => {
            const cmd = btn.dataset.docCmd;
            const block = btn.dataset.docBlock;
            if (els.astralDocEditor) els.astralDocEditor.focus();
            if (cmd) {
              document.execCommand(cmd, false, null);
            } else if (block) {
              document.execCommand('formatBlock', false, block);
            }
            saveActiveDoc(false);
          });
        });

        onEl(els.btnCloseImageViewer, 'click', closeImageViewer);
        onEl(els.btnViewerZoomIn, 'click', () => {
          appState.imageViewer.scale = Math.min(4, Number((appState.imageViewer.scale + 0.2).toFixed(2)));
          applyImageViewerTransform();
        });
        onEl(els.btnViewerZoomOut, 'click', () => {
          appState.imageViewer.scale = Math.max(0.25, Number((appState.imageViewer.scale - 0.2).toFixed(2)));
          applyImageViewerTransform();
        });
        onEl(els.btnViewerFit, 'click', () => {
          appState.imageViewer.scale = 1;
          applyImageViewerTransform();
        });
        onEl(els.btnViewerReset, 'click', () => {
          appState.imageViewer = { scale: 1, rotation: 0 };
          applyImageViewerTransform();
        });
        onEl(els.btnViewerRotate, 'click', () => {
          appState.imageViewer.rotation = (appState.imageViewer.rotation + 90) % 360;
          applyImageViewerTransform();
        });
        onEl(els.btnApplyViewerUrl, 'click', () => {
          if (!appState.activeImagePlanetId || !els.imageViewerUrlInput) return;
          const planet = getPlanetById(appState.activeImagePlanetId);
          const url = els.imageViewerUrlInput.value.trim();
          if (planet && url) {
            pushUndoCheckpoint();
            planet.imageUrl = url;
            planet.updatedAt = Date.now();
            if (els.imageViewerError) els.imageViewerError.classList.add('hidden');
            if (els.imageViewerImg) {
              els.imageViewerImg.classList.remove('hidden');
              els.imageViewerImg.src = url;
            }
            saveStateToLocalStorage(true);
            showToast('画像URLを更新しました', 'ph-image');
          }
        });
        onEl(els.btnUploadViewerFile, 'click', () => {
          if (els.imageViewerFileInput) els.imageViewerFileInput.click();
        });
        onEl(els.imageViewerFileInput, 'change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file || !appState.activeImagePlanetId) return;
          const planet = getPlanetById(appState.activeImagePlanetId);
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = String(reader.result || '');
            if (planet && dataUrl) {
              pushUndoCheckpoint();
              planet.imageUrl = dataUrl;
              planet.name = file.name;
              planet.updatedAt = Date.now();
              if (els.imageViewerTitle) els.imageViewerTitle.textContent = planet.name;
              if (els.imageViewerError) els.imageViewerError.classList.add('hidden');
              if (els.imageViewerImg) {
                els.imageViewerImg.classList.remove('hidden');
                els.imageViewerImg.src = dataUrl;
              }
              renderExplorer();
              renderInspector();
              saveStateToLocalStorage(true);
              showToast(`画像を「${file.name}」に変更しました`, 'ph-image');
            }
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });
        onEl(els.imageViewerImg, 'error', () => {
          if (els.imageViewerImg) els.imageViewerImg.classList.add('hidden');
          if (els.imageViewerError) els.imageViewerError.classList.remove('hidden');
        });

        window.addEventListener('keydown', (e) => {
          const isEditingField =
            e.target &&
            (e.target.tagName === 'INPUT' ||
              e.target.tagName === 'TEXTAREA' ||
              e.target.isContentEditable);

          if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'z' || e.key === 'Z') && !isEditingField) {
            e.preventDefault();
            if (e.shiftKey) {
              redoLastAction();
            } else {
              undoLastAction();
            }
            return;
          }
          if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === 'y' || e.key === 'Y') && !isEditingField) {
            e.preventDefault();
            redoLastAction();
            return;
          }

          if (e.shiftKey && (e.key === 'H' || e.key === 'h')) {
            e.preventDefault();
            setHudHidden(!appState.hudHidden);
          } else if (e.key === 'Escape') {
            if (colorPopoverState.open) closeColorPopover();
            else if (els.blackHoleModal && !els.blackHoleModal.classList.contains('hidden')) closeBlackHoleModal();
            else if (els.supabaseSyncModal && !els.supabaseSyncModal.classList.contains('hidden')) closeSyncModal();
            else if (els.astralImageViewerModal && !els.astralImageViewerModal.classList.contains('hidden')) closeImageViewer();
            else if (els.astralDocModal && !els.astralDocModal.classList.contains('hidden')) saveActiveDoc(true);
          }
        });
      }

      function bootAstralOcean() {
        reconcileSelection();
        bindAllEvents();
        initViewportEngine();
        renderAllUI();
        if (appState.syncConfig && appState.syncConfig.enabled && isInviteAuthenticated()) {
          startSyncLoop();
        } else {
          if (appState.syncConfig && appState.syncConfig.enabled && !isInviteAuthenticated()) {
            appState.syncConfig.enabled = false;
            saveSyncConfigToLocalStorage();
          }
          stopSyncLoop();
          updateInviteAuthUI();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootAstralOcean);
      } else {
        bootAstralOcean();
      }
    })();
  </script>
</body>
</html>
