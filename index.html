<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astral Ocean — 幾何学・黒基調 空間ファイル整理アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Hiragino Sans', 'Meiryo', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@phosphor-icons/web" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
      overflow: hidden;
      background-color: #000000;
      color: #f4f4f5;
      touch-action: manipulation;
    }

    #viewport-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: radial-gradient(circle at 50% 45%, #09090b 0%, #000000 78%);
    }

    #viewport-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    #astralDocEditor {
      user-select: text;
      -webkit-user-select: text;
      min-height: 320px;
      outline: none;
    }
    #astralDocEditor h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0.75rem 0 0.5rem;
      color: #fafafa;
    }
    #astralDocEditor h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0.65rem 0 0.4rem;
      color: #e4e4e7;
    }
    #astralDocEditor p {
      margin: 0.45rem 0;
      line-height: 1.75;
    }
    #astralDocEditor ul, #astralDocEditor ol {
      padding-left: 1.5rem;
      margin: 0.45rem 0;
    }
    #astralDocEditor blockquote {
      border-left: 2px solid #38bdf8;
      padding: 0.35rem 0.9rem;
      color: #a1a1aa;
      font-style: italic;
      margin: 0.5rem 0;
      background: rgba(24, 24, 27, 0.85);
    }

    .hud-element {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .hud-hidden .hud-element {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(-6px);
    }

    #restoreHudFloatingBtn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.96);
      transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .hud-hidden #restoreHudFloatingBtn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .checker-bg {
      background-image:
        linear-gradient(45deg, rgba(24, 24, 27, 0.85) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(24, 24, 27, 0.85) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(24, 24, 27, 0.85) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(24, 24, 27, 0.85) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    input[type="range"] {
      cursor: pointer;
    }

    #colorPickerPopover {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 45;
      width: 19rem;
      max-width: calc(100vw - 2rem);
    }

    .color-slider-track {
      -webkit-appearance: none;
      appearance: none;
      height: 1.5rem;
      border-radius: 9999px;
      outline: none;
    }

    .color-slider-track::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 9999px;
      background: rgba(9, 9, 11, 0.35);
      border: 2.5px solid #09090b;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }

    .color-slider-track::-moz-range-thumb {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 9999px;
      background: rgba(9, 9, 11, 0.35);
      border: 2.5px solid #09090b;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 antialiased">
  <!-- 幾何学・黒基調 空間ビューポートコンテナ -->
  <div id="viewport-container"></div>

  <!-- HUD非表示時のフローティング再表示ボタン -->
  <button id="restoreHudFloatingBtn" type="button" title="画面UIを再表示 (Shift+H)" class="fixed top-4 right-4 z-40 flex items-center gap-2 rounded-xl bg-zinc-950/90 hover:bg-zinc-900 active:scale-95 backdrop-blur-md border border-sky-400/60 px-4 py-2.5 text-xs sm:text-sm font-semibold text-sky-200 cursor-pointer">
    <i class="ph-bold ph-eye text-base text-sky-400"></i>
    <span>再表示</span>
    <span class="hidden sm:inline rounded bg-zinc-900 border border-zinc-800 px-1.5 py-0.5 text-[10px] font-mono text-zinc-400">Shift+H</span>
  </button>

  <!-- トースト通知 -->
  <div id="toastBanner" class="hud-element fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-200 rounded-xl bg-zinc-950/95 border border-zinc-700 px-4 py-2 text-xs font-medium text-zinc-100 flex items-center gap-2 opacity-0 translate-y-2">
    <i id="toastIcon" class="ph ph-info text-sky-400 text-sm"></i>
    <span id="toastText">通知</span>
  </div>

  <!-- トップヘッダー -->
  <header class="hud-element fixed top-3 left-3 right-3 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="pointer-events-auto flex flex-wrap items-center gap-2 rounded-xl bg-zinc-950/90 backdrop-blur-md border border-zinc-800 px-3 py-2">
      <button id="btnToggleExplorer" type="button" title="エクスプローラーを開閉" class="rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-2 text-sky-400 transition">
        <i class="ph ph-sidebar-simple text-base"></i>
      </button>

      <!-- 戻す・進むタブ -->
      <button id="btnUndoAction" type="button" disabled title="操作を巻き戻す (Ctrl+Z / ⌘Z)" class="rounded-lg bg-black hover:bg-zinc-900 border border-zinc-800 p-2 text-zinc-200 disabled:opacity-35 disabled:pointer-events-none transition flex items-center justify-center">
        <i class="ph ph-arrow-u-up-left text-base text-sky-400"></i>
      </button>
      <button id="btnRedoAction" type="button" disabled title="やり直し (Ctrl+Y / ⌘Shift+Z)" class="rounded-lg bg-black hover:bg-zinc-900 border border-zinc-800 p-2 text-zinc-200 disabled:opacity-35 disabled:pointer-events-none transition flex items-center justify-center">
        <i class="ph ph-arrow-u-up-right text-base text-zinc-400"></i>
      </button>

      <!-- 検索 -->
      <div class="relative">
        <div class="flex items-center rounded-lg bg-black border border-zinc-800 px-2.5 py-1.5 w-36 sm:w-48 focus-within:border-sky-400 transition">
          <i class="ph ph-magnifying-glass text-zinc-500 text-xs mr-1.5"></i>
          <input id="searchInput" type="text" placeholder="検索..." class="w-full bg-transparent text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none">
          <button id="btnClearSearch" type="button" class="hidden text-zinc-500 hover:text-zinc-300 text-xs">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <div id="searchDropdown" class="hidden absolute left-0 mt-1.5 w-64 max-h-72 overflow-y-auto rounded-xl bg-zinc-950/95 backdrop-blur-md border border-zinc-800 p-1.5 z-50 text-xs"></div>
      </div>

      <div class="hidden sm:block h-5 w-px bg-zinc-800 mx-0.5"></div>

      <!-- 公転一時停止・速度プリセット -->
      <div class="hidden xl:flex items-center gap-1 rounded-lg bg-black border border-zinc-800 px-1.5 py-1 text-xs">
        <button id="btnPauseOrbit" type="button" title="公転一時停止/再開" class="rounded p-1 hover:bg-zinc-900 text-zinc-300 transition">
          <i id="pauseOrbitIcon" class="ph ph-pause text-sm"></i>
        </button>
        <button data-speed-preset="0.25" type="button" class="speed-preset-btn rounded px-1.5 py-0.5 text-[11px] font-mono text-zinc-500 hover:text-zinc-200">0.25x</button>
        <button data-speed-preset="0.5" type="button" class="speed-preset-btn rounded px-1.5 py-0.5 text-[11px] font-mono bg-zinc-900 text-sky-300 border border-sky-500/30">0.5x</button>
        <button data-speed-preset="1" type="button" class="speed-preset-btn rounded px-1.5 py-0.5 text-[11px] font-mono text-zinc-500 hover:text-zinc-200">1x</button>
        <button data-speed-preset="2" type="button" class="speed-preset-btn rounded px-1.5 py-0.5 text-[11px] font-mono text-zinc-500 hover:text-zinc-200">2x</button>
      </div>

      <!-- 拡大縮小コントロール -->
      <div class="flex items-center gap-1 rounded-lg bg-black border border-zinc-800 px-2 py-1 text-xs">
        <button id="btnZoomOut" type="button" title="ズームアウト (-)" class="rounded p-0.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 transition"><i class="ph ph-minus text-xs"></i></button>
        <input id="cameraZoomRange" type="range" min="25" max="1800" step="1" value="247" class="w-16 sm:w-20 accent-sky-400">
        <button id="btnZoomIn" type="button" title="ズームイン (+)" class="rounded p-0.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200 transition"><i class="ph ph-plus text-xs"></i></button>
        <span id="cameraZoomPercent" class="w-10 text-right font-mono text-[11px] text-sky-300">100%</span>
        <button id="btnZoomReset" type="button" title="ズーム倍率リセット (100%)" class="rounded px-1.5 py-0.5 text-[10px] bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 transition">100%</button>
      </div>

      <!-- 新規フォルダ・新規ファイル・読込・自由視点・視点リセット・同期・3D/2D・画面非表示 -->
      <button id="btnAddStar" type="button" title="新規フォルダ（恒星系）" class="flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-amber-500/40 p-1.5 font-medium text-amber-300 text-xs transition">
        <i class="ph ph-sun text-base"></i>
      </button>

      <button id="btnOpenNewPlanetModal" type="button" title="新規ファイル（惑星）" class="flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-sky-500/40 p-1.5 font-medium text-sky-300 text-xs transition">
        <i class="ph ph-planet text-base"></i>
      </button>

      <label title="読込" class="flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 p-1.5 font-medium text-zinc-200 text-xs cursor-pointer transition">
        <i class="ph ph-folder-open text-base text-sky-400"></i>
        <input id="localFileInput" type="file" multiple class="hidden">
      </label>

      <button id="btnOpenSyncModal" type="button" title="招待コード認証・同期接続" class="flex items-center gap-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 px-2 py-1.5 font-medium text-zinc-200 text-xs transition">
        <span id="syncStatusDot" class="h-2 w-2 rounded-full bg-zinc-600"></span>
        <i class="ph ph-cloud-check text-base text-sky-400"></i>
      </button>

      <button id="btnUnlockCamera" type="button" title="視点ロックを解除" class="rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-sky-500/40 p-1.5 text-sky-300 transition flex items-center justify-center">
        <i class="ph ph-lock-open text-base"></i>
      </button>

      <button id="btnResetView" type="button" title="視点をリセット" class="flex items-center justify-center rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-1.5 text-zinc-200 text-xs transition">
        <i class="ph ph-compass text-base text-sky-400"></i>
      </button>

      <div class="flex items-center rounded-lg bg-black border border-zinc-800 p-0.5 text-[11px] font-medium">
        <button id="btnMode3D" type="button" title="3D表示" class="rounded-md px-2 py-1 bg-zinc-900 text-sky-300 border border-sky-500/40 transition flex items-center justify-center">
          <i class="ph ph-polygon text-sm"></i>
        </button>
        <button id="btnMode2D" type="button" title="2D表示" class="rounded-md px-2 py-1 text-zinc-500 hover:text-zinc-200 transition flex items-center justify-center">
          <i class="ph ph-diamond text-sm"></i>
        </button>
      </div>

      <button id="btnToggleInspector" type="button" title="恒星・惑星インスペクターを開閉" class="rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-1.5 text-sky-400 transition flex items-center justify-center">
        <i class="ph ph-sliders-horizontal text-sm"></i>
      </button>

      <button id="btnToggleHud" type="button" title="画面非表示 / 再表示 (Shift+H)" class="rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 p-1.5 text-zinc-400 transition">
        <i class="ph ph-eye-slash text-sm"></i>
      </button>
    </div>
  </header>

  <!-- 左サイドバー：エクスプローラー -->
  <aside id="explorerPanel" class="hud-element fixed top-20 bottom-4 left-3 z-20 w-72 max-w-[85vw] flex flex-col rounded-xl bg-zinc-950/90 backdrop-blur-md border border-zinc-800 overflow-hidden transition-transform duration-200">
    <div class="flex items-center justify-between px-3 py-2 border-b border-zinc-800">
      <div class="flex items-center gap-1.5">
        <i class="ph ph-compass text-sky-400 text-sm"></i>
        <span class="font-semibold text-xs tracking-wide text-zinc-100">エクスプローラー</span>
      </div>
      <div class="flex items-center gap-1">
        <button id="btnExpandAllPlanets" type="button" title="すべて展開" class="rounded p-1 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
          <i class="ph ph-arrows-out-line-vertical text-xs"></i>
        </button>
        <button id="btnCollapseAllPlanets" type="button" title="すべて折りたたむ" class="rounded p-1 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
          <i class="ph ph-arrows-in-line-vertical text-xs"></i>
        </button>
        <button id="btnCloseExplorer" type="button" title="閉じる" class="rounded p-1 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition">
          <i class="ph ph-x text-xs"></i>
        </button>
      </div>
    </div>

    <div class="px-3 pt-2 pb-1.5 border-b border-zinc-800/80 space-y-2">
      <div class="grid grid-cols-2 gap-1 rounded-lg bg-black p-1 border border-zinc-800 text-[11px]">
        <button id="tabStarTree" type="button" class="rounded py-1 font-medium bg-zinc-900 text-sky-300 border border-sky-500/30 transition">星系ツリー</button>
        <button id="tabAllFiles" type="button" class="rounded py-1 font-medium text-zinc-500 hover:text-zinc-200 transition">全ファイル</button>
      </div>

      <div class="flex items-center gap-1 overflow-x-auto pb-0.5 text-[11px]">
        <button data-type-filter="all" type="button" class="type-filter-btn shrink-0 rounded px-2 py-0.5 bg-zinc-900 text-sky-300 border border-sky-500/40">すべて</button>
        <button data-type-filter="document" type="button" class="type-filter-btn shrink-0 rounded px-2 py-0.5 bg-black text-zinc-500 hover:text-zinc-200 border border-zinc-800">文書</button>
        <button data-type-filter="image" type="button" class="type-filter-btn shrink-0 rounded px-2 py-0.5 bg-black text-zinc-500 hover:text-zinc-200 border border-zinc-800">画像</button>
      </div>
    </div>

    <div id="explorerList" class="flex-1 overflow-y-auto p-2.5 space-y-2 text-xs"></div>

    <div class="px-3 py-2 border-t border-zinc-800 bg-black/70 text-[11px] text-zinc-500 flex items-center justify-between">
      <span>惑星をドラッグして別恒星へ移籍</span>
      <span id="explorerCounts" class="font-mono text-zinc-300">1恒星 / 8惑星</span>
    </div>
  </aside>

  <!-- 右サイドバー：インスペクター -->
  <aside id="inspectorPanel" class="hud-element fixed top-20 bottom-4 right-3 z-20 w-80 max-w-[88vw] flex flex-col rounded-xl bg-zinc-950/90 backdrop-blur-md border border-zinc-800 overflow-hidden transition-transform duration-200">
    <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <i id="inspectorHeaderIcon" class="ph-fill ph-sun text-amber-400 text-base"></i>
        <span id="inspectorHeaderTitle" class="font-semibold text-xs tracking-wide text-zinc-100">恒星インスペクター</span>
      </div>
      <button id="btnCloseInspector" type="button" class="rounded p-1 text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900"><i class="ph ph-x text-xs"></i></button>
    </div>
    <div id="inspectorContent" class="flex-1 overflow-y-auto p-3.5 space-y-4 text-xs"></div>
  </aside>

  <!-- カラーピッカーポップオーバー -->
  <div id="colorPickerPopover" class="hidden rounded-2xl bg-zinc-900/95 backdrop-blur-xl border border-zinc-700/80 shadow-2xl p-4 space-y-3.5 text-xs select-none">
    <div class="flex items-center justify-between">
      <button id="btnColorEyedropper" type="button" title="画面上の色をスポイト取得" class="rounded-lg p-1.5 text-sky-400 hover:bg-zinc-800 transition">
        <i class="ph-fill ph-eyedropper text-base"></i>
      </button>
      <span class="font-bold text-sm text-zinc-100">カラー</span>
      <button id="btnCloseColorPopover" type="button" title="カラータブを閉じる" class="rounded-lg p-1.5 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800 transition">
        <i class="ph ph-x text-sm"></i>
      </button>
    </div>

    <div class="grid grid-cols-3 rounded-lg bg-black/80 p-0.5 border border-zinc-800 text-[11px] font-medium">
      <button data-color-mode="grid" type="button" class="color-mode-btn rounded-md py-1 text-zinc-400 hover:text-zinc-200 transition">グリッド</button>
      <button data-color-mode="spectrum" type="button" class="color-mode-btn rounded-md py-1 text-zinc-400 hover:text-zinc-200 transition">スペクトラム</button>
      <button data-color-mode="sliders" type="button" class="color-mode-btn rounded-md py-1 bg-zinc-700/90 text-zinc-100 transition">スライダ</button>
    </div>

    <div id="colorViewSliders" class="space-y-2.5">
      <div class="space-y-1">
        <div class="flex items-center justify-between text-[11px] text-zinc-300">
          <span>レッド</span>
          <span id="colorValR" class="rounded bg-black/80 border border-zinc-800 px-2.5 py-0.5 font-mono text-zinc-100">245</span>
        </div>
        <input id="colorSliderR" type="range" min="0" max="255" step="1" value="245" class="color-slider-track w-full">
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between text-[11px] text-zinc-300">
          <span>グリーン</span>
          <span id="colorValG" class="rounded bg-black/80 border border-zinc-800 px-2.5 py-0.5 font-mono text-zinc-100">158</span>
        </div>
        <input id="colorSliderG" type="range" min="0" max="255" step="1" value="158" class="color-slider-track w-full">
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between text-[11px] text-zinc-300">
          <span>ブルー</span>
          <span id="colorValB" class="rounded bg-black/80 border border-zinc-800 px-2.5 py-0.5 font-mono text-zinc-100">11</span>
        </div>
        <input id="colorSliderB" type="range" min="0" max="255" step="1" value="11" class="color-slider-track w-full">
      </div>
    </div>

    <div id="colorViewGrid" class="hidden grid grid-cols-6 gap-1.5 py-1"></div>

    <div id="colorViewSpectrum" class="hidden space-y-2 py-1">
      <input id="colorSpectrumHue" type="range" min="0" max="360" step="1" value="38" class="w-full accent-sky-400" style="background: linear-gradient(90deg, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%); height: 14px; border-radius: 9999px;">
      <input id="colorSpectrumLight" type="range" min="15" max="85" step="1" value="52" class="w-full accent-sky-400">
    </div>

    <div class="flex items-center justify-between gap-2 pt-0.5">
      <span class="text-[11px] text-sky-400 font-medium">sRGB 16進数カラー値</span>
      <input id="colorHexInput" type="text" maxlength="7" class="w-24 rounded-lg bg-black/80 border border-zinc-800 px-2.5 py-1 text-center font-mono text-xs text-zinc-100 uppercase focus:outline-none focus:border-sky-400">
    </div>

    <div class="flex items-center gap-2.5 pt-0.5">
      <div id="colorActiveSwatch" class="h-11 w-11 rounded-xl border border-zinc-700 shrink-0" style="background-color: #f59e0b;"></div>
      <div class="flex flex-wrap items-center gap-2 flex-1">
        <button data-swatch-hex="#09090b" type="button" class="color-preset-swatch h-6 w-6 rounded-full bg-zinc-950 border border-zinc-700 transition hover:scale-110"></button>
        <button data-swatch-hex="#2563eb" type="button" class="color-preset-swatch h-6 w-6 rounded-full bg-blue-600 transition hover:scale-110"></button>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEYS = {
        STATE: 'astral_ocean_state_v1',
        SYNC_CONFIG: 'astral_ocean_sync_config_v1',
        INVITE_AUTH: 'astral_ocean_invite_auth_v1'
      };

      const INVITE_CODE_PLAIN = '#9@k2$M7!p4&';

      function utf8ToBase64(str) {
        const s = String(str ?? '');
        try {
          if (typeof TextEncoder !== 'undefined') {
            const bytes = new TextEncoder().encode(s);
            let bin = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
              const slice = bytes.subarray(i, i + chunkSize);
              bin += String.fromCharCode.apply(null, slice);
            }
            return btoa(bin);
          }
        } catch (err) {
          // Fallback to legacy percent-encoding conversion
        }
        return btoa(unescape(encodeURIComponent(s)));
      }

      function deterministicFallbackHashHex(input) {
        const str = String(input || '');
        const seeds = [0x811c9dc5, 0x01000193, 0x9e3779b9, 0x85ebca6b, 0xc2b2ae35, 0x27d4eb2f, 0x165667b1, 0xd3a2646c];
        let hex = '';
        for (let block = 0; block < 8; block++) {
          let h = seeds[block] >>> 0;
          for (let i = 0; i < str.length; i++) {
            const ch = str.charCodeAt(i) + block * 131 + i * 17;
            h ^= ch & 0xff;
            h = Math.imul(h, 0x01000193) >>> 0;
            h ^= (ch >>> 8) & 0xff;
            h = Math.imul(h, 0x85ebca6b) >>> 0;
            h ^= h >>> 13;
          }
          hex += (h >>> 0).toString(16).padStart(8, '0');
        }
        return hex;
      }

      async function computeInviteHashHex(plainCode) {
        const normalized = String(plainCode || '').trim();
        if (!normalized) return '';
        try {
          if (typeof window !== 'undefined' && window.crypto && window.crypto.subtle && typeof TextEncoder !== 'undefined') {
            const bytes = new TextEncoder().encode(normalized);
            const digest = await window.crypto.subtle.digest('SHA-256', bytes);
            const arr = Array.from(new Uint8Array(digest));
            return arr.map((b) => b.toString(16).padStart(2, '0')).join('');
          }
        } catch (err) {
          // Fallback when Web Crypto subtle digest is unavailable
        }
        return deterministicFallbackHashHex(normalized);
      }

      let EXPECTED_INVITE_HASH_HEX = deterministicFallbackHashHex(INVITE_CODE_PLAIN.trim());
      const expectedHashReadyPromise = (async () => {
        const computed = await computeInviteHashHex(INVITE_CODE_PLAIN);
        if (computed) {
          EXPECTED_INVITE_HASH_HEX = computed;
        }
        return EXPECTED_INVITE_HASH_HEX;
      })();

      const DEFAULT_SUPABASE_CONFIG = {
        enabled: false,
        url: 'https://zdyegofffljtpplbfbpr.supabase.co',
        anonKey: 'sb_publishable_sn8spfNt0po5v3y1UNgN0g_cwLNSzq6',
        table: 'astral_ocean_rooms',
        roomId: 'astral-main-room'
      };

      function normalizeSupabaseUrl(rawUrl) {
        const trimmed = String(rawUrl || '').trim().replace(/\/+$/, '');
        if (!trimmed) return '';
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        if (/^[a-z0-9-]+$/i.test(trimmed)) {
          return `https://${trimmed}.supabase.co`;
        }
        return `https://${trimmed}`;
      }

      const BASE_DISTANCE = 420;
      const DEFAULT_ZOOM_SCALE = 1.7;
      const DEFAULT_CAMERA_DISTANCE = Math.round(BASE_DISTANCE / DEFAULT_ZOOM_SCALE);

      const $ = (id) => {
        try {
          return document.getElementById(id) || null;
        } catch (err) {
          return null;
        }
      };

      function onEl(el, eventName, handler, options) {
        if (!el || typeof el.addEventListener !== 'function' || typeof handler !== 'function') return;
        el.addEventListener(eventName, handler, options);
      }

      function setModalVisibility(modalEl, visible) {
        if (!modalEl) return;
        if (visible) {
          modalEl.classList.remove('hidden', 'pointer-events-none');
          modalEl.classList.add('pointer-events-auto');
        } else {
          modalEl.classList.add('hidden', 'pointer-events-none');
          modalEl.classList.remove('pointer-events-auto');
        }
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function createDefaultSampleImageDataUrl(label = 'Geometric Planet', bgHex = '#09090b', accentHex = '#38bdf8') {
        const safeLabel = String(label || 'Planet').slice(0, 32);
        const safeBg = /^#[0-9a-fA-F]{3,8}$/.test(bgHex) ? bgHex : '#09090b';
        const safeAccent = /^#[0-9a-fA-F]{3,8}$/.test(accentHex) ? accentHex : '#38bdf8';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
          <rect width="800" height="500" fill="#000000"/>
          <polygon points="400,95 535,172 535,328 400,405 265,328 265,172" fill="${safeBg}" stroke="${safeAccent}" stroke-width="3"/>
          <polygon points="400,130 500,250 400,370 300,250" fill="none" stroke="#fafafa" stroke-opacity="0.55" stroke-width="1.5"/>
          <ellipse cx="400" cy="250" rx="220" ry="52" fill="none" stroke="${safeAccent}" stroke-opacity="0.6" stroke-width="2" transform="rotate(-14 400 250)"/>
          <text x="400" y="452" fill="#e4e4e7" font-family="sans-serif" font-size="20" text-anchor="middle">${escapeHtml(safeLabel)}</text>
        </svg>`;
        try {
          return `data:image/svg+xml;base64,${utf8ToBase64(svg)}`;
        } catch (err) {
          return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }
      }

      function normalizePlanetType(planet) {
        if (!planet || typeof planet !== 'object') return 'document';
        if (planet.type === 'image') return 'image';
        if (planet.type === 'video') {
          return planet.imageUrl && String(planet.imageUrl).trim() ? 'image' : 'document';
        }
        return 'document';
      }

      function normalizePlanetsList(planets) {
        if (!Array.isArray(planets)) return [];
        return planets.map((p) => {
          const nextType = normalizePlanetType(p);
          const cleaned = {
            ...p,
            type: nextType
          };
          delete cleaned.videoUrl;
          delete cleaned.videoDuration;
          if (nextType === 'image' && !cleaned.imageUrl) {
            cleaned.imageUrl = createDefaultSampleImageDataUrl(cleaned.name || 'Image', '#09090b', '#f472b6');
          }
          return cleaned;
        });
      }

      function createInitialState() {
        const now = Date.now();
        return {
          viewMode: '3d',
          orbitPaused: false,
          orbitSpeed: 0.5,
          cameraDistance: DEFAULT_CAMERA_DISTANCE,
          selectedKind: 'star',
          selectedId: 'star-sun',
          lockedTarget: null,
          explorerTab: 'tree',
          typeFilter: 'all',
          collapsedStarIds: [],
          expandedPlanetIds: ['planet-earth'],
          stars: [

      function loadStateFromLocalStorage() {
        const fallback = createInitialState();
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.STATE);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.stars) || parsed.stars.length === 0 || !Array.isArray(parsed.planets)) {
            return fallback;
          }
          const validFilters = new Set(['all', 'document', 'image']);
          return {
            ...fallback,
            ...parsed,
            typeFilter: validFilters.has(parsed.typeFilter) ? parsed.typeFilter : 'all',
            collapsedStarIds: Array.isArray(parsed.collapsedStarIds) ? parsed.collapsedStarIds : [],
            expandedPlanetIds: Array.isArray(parsed.expandedPlanetIds) ? parsed.expandedPlanetIds : [],
            planets: normalizePlanetsList(parsed.planets)
          };
        } catch (err) {
          return fallback;
        }
      }

      function loadSyncConfigFromLocalStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.SYNC_CONFIG);
          if (!raw) return { ...DEFAULT_SUPABASE_CONFIG };
          const parsed = JSON.parse(raw);
          const url = normalizeSupabaseUrl(parsed && parsed.url ? parsed.url : DEFAULT_SUPABASE_CONFIG.url);
          const anonKey = DEFAULT_SUPABASE_CONFIG.anonKey;
          return {
            enabled: false,
            url: url || DEFAULT_SUPABASE_CONFIG.url,
            anonKey,
            table: (parsed && parsed.table) ? String(parsed.table).trim() : DEFAULT_SUPABASE_CONFIG.table,
            roomId: (parsed && parsed.roomId) ? String(parsed.roomId).trim() : DEFAULT_SUPABASE_CONFIG.roomId
          };
        } catch (err) {
          return { ...DEFAULT_SUPABASE_CONFIG };
        }
      }

      async function verifyAndAuthenticateInviteCode(rawCode, showFeedback = true) {
        const normalizedCode = String(rawCode || '').trim();
        if (!normalizedCode) {
          if (showFeedback) showToast('招待コードを入力してください', 'ph-warning');
          return false;
        }
        const expected = await getExpectedInviteHashHex();
        const actual = await computeInviteHashHex(normalizedCode);
        if (actual && actual === expected) {
          appState.inviteAuth = {
            authenticated: true,
            verifiedAt: Date.now()
          };
          saveInviteAuthToLocalStorage();
          updateInviteAuthUI();
          if (showFeedback) {
            showToast('招待コード認証に成功しました', 'ph-key');
          }
          return true;
        }
        if (showFeedback) {
          showToast('招待コードが一致しません。入力内容を確認してください', 'ph-warning');
        }
        return false;
      }

          planets: Array.isArray(src.planets) ? src.planets : [],
          selectedKind: src.selectedKind || 'star',

      function pushUndoCheckpoint() {
        if (appState.isRestoringHistory) return;
        const snap = cloneWorkspaceSnapshot(appState.data);
        if (appState.undoStack.length > 0 && appState.undoStack[appState.undoStack.length - 1] === snap) {
          return;
        }
        appState.undoStack.push(snap);
        if (appState.undoStack.length > MAX_HISTORY_STEPS) {
          appState.undoStack.shift();
        }
        appState.redoStack = [];
        updateUndoRedoUI();
      }

      function applyWorkspaceSnapshot(snapshotJson) {
        const parsed = JSON.parse(snapshotJson);
        appState.isRestoringHistory = true;
        try {
          appState.data.stars = Array.isArray(parsed.stars) ? parsed.stars : appState.data.stars;
          appState.data.planets = normalizePlanetsList(parsed.planets);
          appState.data.selectedKind = parsed.selectedKind || 'star';
          appState.data.selectedId = parsed.selectedId || (appState.data.stars[0] ? appState.data.stars[0].id : null);
          appState.data.lockedTarget = parsed.lockedTarget || null;
          appState.data.collapsedStarIds = Array.isArray(parsed.collapsedStarIds) ? parsed.collapsedStarIds : [];
          appState.data.expandedPlanetIds = Array.isArray(parsed.expandedPlanetIds) ? parsed.expandedPlanetIds : [];
          reconcileSelection();
          rebuild3DScene();
          renderAllUI();
          saveStateToLocalStorage(true);
        } finally {
          appState.isRestoringHistory = false;
        }
      }

      function undoLastAction() {
        if (appState.undoStack.length === 0) {
          showToast('巻き戻せる操作はありません', 'ph-info');
          return;
        }
        const currentSnap = cloneWorkspaceSnapshot(appState.data);
        const prevSnap = appState.undoStack.pop();
        appState.redoStack.push(currentSnap);
        applyWorkspaceSnapshot(prevSnap);
        updateUndoRedoUI();
        showToast('直前の操作を巻き戻しました', 'ph-arrow-u-up-left');
      }

      function redoLastAction() {
        if (appState.redoStack.length === 0) {
          showToast('やり直せる操作はありません', 'ph-info');
          return;
        }
        const currentSnap = cloneWorkspaceSnapshot(appState.data);
        const nextSnap = appState.redoStack.pop();
        appState.undoStack.push(currentSnap);
        applyWorkspaceSnapshot(nextSnap);
        updateUndoRedoUI();
        showToast('操作をやり直しました', 'ph-arrow-u-up-right');
      }

        if (triggerCloudSync && appState.syncConfig && appState.syncConfig.enabled && isInviteAuthenticated()) {
          pushStateToSupabase(false);
        }

      function buildSupabaseHeaders(apiKey, extra = {}) {
        const key = String(apiKey || '').trim();
        const headers = {
          'apikey': key,
          ...extra
        };
        if (/^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(key)) {
          headers['Authorization'] = `Bearer ${key}`;
        }
        return headers;
      }

      async function pushStateToSupabase(notify = false) {
        if (!isInviteAuthenticated()) {
          stopSyncLoop();
          appState.isSyncing = false;
          updateInviteAuthUI();
          if (notify) showToast('招待コード未認証のため同期をブロックしました', 'ph-lock');
          return;
        }
        const cfg = appState.syncConfig;
        if (!cfg || !cfg.enabled || !cfg.url || !cfg.anonKey) return;
        if (appState.isSyncing) return;

        appState.isSyncing = true;
        updateSyncStatusUI('同期中...', 'bg-amber-400 animate-pulse');
        try {
          const baseUrl = normalizeSupabaseUrl(cfg.url);
          const table = encodeURIComponent((cfg.table || 'astral_ocean_rooms').trim());
          const roomId = (cfg.roomId || 'astral-main-room').trim();
          const ts = Math.max(Number(appState.data.updatedAt || 0), Date.now());
          appState.data.updatedAt = ts;

          const endpoint = `${baseUrl}/rest/v1/${table}?on_conflict=room_id`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: buildSupabaseHeaders(cfg.anonKey, {
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates,return=minimal'
            }),
            body: JSON.stringify([
              {
                room_id: roomId,
                payload: appState.data,
                updated_at: new Date(ts).toISOString()
              }
            ])
          });
          if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error(`HTTP ${res.status}${errText ? `: ${errText.slice(0, 80)}` : ''}`);
          }
          appState.lastSyncedRemoteTs = ts;
          updateSyncStatusUI('同期接続中', 'bg-emerald-400');
          if (notify) showToast('同期接続が完了しました', 'ph-cloud-check');
        } catch (err) {
          updateSyncStatusUI('同期エラー', 'bg-rose-500');
          if (notify) showToast(`同期接続失敗: ${err.message}`, 'ph-warning');
        } finally {
          appState.isSyncing = false;
        }
      }

      async function pullStateFromSupabase(notify = false) {
        if (!isInviteAuthenticated()) {
          stopSyncLoop();
          appState.isSyncing = false;
          updateInviteAuthUI();
          if (notify) showToast('招待コード未認証のため同期をブロックしました', 'ph-lock');
          return;
        }
        const cfg = appState.syncConfig;
        if (!cfg || !cfg.enabled || !cfg.url || !cfg.anonKey) return;
        if (appState.isSyncing) return;

        appState.isSyncing = true;
        let shouldPushAfterRelease = false;
        try {
          const baseUrl = normalizeSupabaseUrl(cfg.url);
          const table = encodeURIComponent((cfg.table || 'astral_ocean_rooms').trim());
          const roomId = encodeURIComponent((cfg.roomId || 'astral-main-room').trim());
          const endpoint = `${baseUrl}/rest/v1/${table}?room_id=eq.${roomId}&select=payload,updated_at`;
          const res = await fetch(endpoint, {
            method: 'GET',
            headers: buildSupabaseHeaders(cfg.anonKey)
          });
          if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error(`HTTP ${res.status}${errText ? `: ${errText.slice(0, 80)}` : ''}`);
          }
          const rows = await res.json();
          if (Array.isArray(rows) && rows.length > 0 && rows[0].payload) {
            const remote = rows[0].payload;
            const rowUpdatedMs = rows[0].updated_at ? new Date(rows[0].updated_at).getTime() : 0;
            const remoteTs = Math.max(Number(remote.updatedAt || 0), Number.isFinite(rowUpdatedMs) ? rowUpdatedMs : 0);
            const localTs = Number(appState.data.updatedAt || 0);

            if (remoteTs > localTs && Array.isArray(remote.stars) && remote.stars.length > 0 && Array.isArray(remote.planets)) {
              const validFilters = new Set(['all', 'document', 'image']);
              appState.data = {
                ...createInitialState(),
                ...remote,
                typeFilter: validFilters.has(remote.typeFilter) ? remote.typeFilter : 'all',
                collapsedStarIds: Array.isArray(remote.collapsedStarIds) ? remote.collapsedStarIds : [],
                expandedPlanetIds: Array.isArray(remote.expandedPlanetIds) ? remote.expandedPlanetIds : [],
                planets: normalizePlanetsList(remote.planets),
                updatedAt: remoteTs
              };
              appState.lastSyncedRemoteTs = remoteTs;
              saveStateToLocalStorage(false);
              reconcileSelection();
              rebuild3DScene();
              renderAllUI();
              updateSyncStatusUI('同期接続中', 'bg-emerald-400');
              if (notify) showToast('最新のデータを同期しました', 'ph-cloud-arrow-down');
            } else {
              updateSyncStatusUI('同期接続中', 'bg-emerald-400');
              if (notify) {
                shouldPushAfterRelease = true;
              }
            }
          } else if (notify) {
            shouldPushAfterRelease = true;
          }
        } catch (err) {
          updateSyncStatusUI('同期エラー', 'bg-rose-500');
          if (notify) showToast(`同期確認エラー: ${err.message}`, 'ph-warning');
        } finally {
          appState.isSyncing = false;
        }

        if (shouldPushAfterRelease) {
          await pushStateToSupabase(true);
        }
      }

      function stopSyncLoop() {
        if (appState.syncTimerId) {
          clearInterval(appState.syncTimerId);
          appState.syncTimerId = null;
        }
      }

      function startSyncLoop() {
        stopSyncLoop();
        if (!isInviteAuthenticated()) {
          updateInviteAuthUI();
          return;
        }
        if (!appState.syncConfig || !appState.syncConfig.enabled) return;
        pullStateFromSupabase(false);
        appState.syncTimerId = setInterval(() => {
          if (!isInviteAuthenticated()) {
            stopSyncLoop();
            updateInviteAuthUI();
            return;
          }
          pullStateFromSupabase(false);
        }, 12000);
      }

        const typedCode = els.inviteCodeInput ? els.inviteCodeInput.value.trim() : '';

      function getPlanetWorldPosition(planet, elapsedSeconds = 0) {
        const star = getStarById(planet.starId) || appState.data.stars[0];
        const basePos = star && star.position ? star.position : { x: 0, y: 0, z: 0 };
        const angle =
          Number(planet.orbitAngle || 0) +
          elapsedSeconds * Number(planet.orbitSpeed || 0.25) * Number(appState.data.orbitSpeed || 0.5);
        const r = Number(planet.orbitRadius || 40);
        const tiltX = Number(planet.orbitTiltX || 0);
        const tiltZ = Number(planet.orbitTiltZ || 0);

        let lx = Math.cos(angle) * r;
        let ly = 0;
        let lz = Math.sin(angle) * r;

        if (tiltX !== 0) {
          const cosX = Math.cos(tiltX);
          const sinX = Math.sin(tiltX);
          const ny = ly * cosX - lz * sinX;
          const nz = ly * sinX + lz * cosX;
          ly = ny;
          lz = nz;
        }

        if (tiltZ !== 0) {
          const cosZ = Math.cos(tiltZ);
          const sinZ = Math.sin(tiltZ);
          const nx = lx * cosZ - ly * sinZ;
          const ny = lx * sinZ + ly * cosZ;
          lx = nx;
          ly = ny;
        }

        return {
          x: (basePos.x || 0) + lx,
          y: (basePos.y || 0) + ly,
          z: (basePos.z || 0) + lz,
          angle
        };
      }

          const axisPoints = [

      function createPlanetGeometry(planet, r) {
        if (!isThreeAvailable()) return null;
        const seedStr = String((planet && (planet.id || planet.name)) || 'poly');
        let seed = 2166136261 >>> 0;
        for (let i = 0; i < seedStr.length; i++) {
          seed ^= seedStr.charCodeAt(i);
          seed = Math.imul(seed, 16777619) >>> 0;
        }
        // 3角形〜12角形（sides = 3..12）の凸多面体へマッピング
        const sides = 3 + (seed % 10);
        const detail = Math.max(0, Math.min(2, Number(planet && planet.meshDetail) || 0));

        if (sides === 3) {
          return new THREE.TetrahedronGeometry(r * 1.12, detail);
        }
        if (sides === 4) {
          return new THREE.OctahedronGeometry(r * 1.05, detail);
        }
        if (sides === 5) {
          return new THREE.DodecahedronGeometry(r * 0.98, detail);
        }
        if (sides === 6) {
          return new THREE.IcosahedronGeometry(r * 0.98, detail);
        }

        // 7角形〜12角形は底面/赤道が n 角形の凸双角錐（Bipyramid）を構築
        const vertices = [];
        const indices = [];
        const topY = r * 1.05;
        const bottomY = -r * 1.05;
        const eqRadius = r * 1.04;

        // 0: 頂点（北極）、1: 底点（南極）、2..(sides+1): 赤道上の凸n角形頂点
        vertices.push(0, topY, 0);
        vertices.push(0, bottomY, 0);
        for (let i = 0; i < sides; i++) {
          const theta = (i / sides) * Math.PI * 2;
          vertices.push(
            Math.cos(theta) * eqRadius,
            0,
            Math.sin(theta) * eqRadius
          );
        }

        for (let i = 0; i < sides; i++) {
          const curr = 2 + i;
          const next = 2 + ((i + 1) % sides);
          // 上半分（頂点0と赤道辺）
          indices.push(0, next, curr);
          // 下半分（底点1と赤道辺）
          indices.push(1, curr, next);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      function buildMeshLatticeObject3D(planet, r, colorHex) {
        const latticeGroup = new THREE.Group();
        const basePolyGeo = createPlanetGeometry(planet, r);
        if (!basePolyGeo) return latticeGroup;

        const wireMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          wireframe: true,
          transparent: true,
          opacity: 0.72
        });
        const wireMesh = new THREE.Mesh(basePolyGeo, wireMat);
        latticeGroup.add(wireMesh);

        const edgesGeo = new THREE.EdgesGeometry(basePolyGeo);
        const edgesMat = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.52
        });
        const edgesLines = new THREE.LineSegments(edgesGeo, edgesMat);
        latticeGroup.add(edgesLines);

        const innerGeo = createPlanetGeometry(planet, r * 0.64);
        if (innerGeo) {
          const innerMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            wireframe: true,
            transparent: true,
            opacity: 0.34
          });
          const innerMesh = new THREE.Mesh(innerGeo, innerMat);
          latticeGroup.add(innerMesh);
        }

        const posAttr = basePolyGeo.getAttribute('position');
        if (posAttr && posAttr.count > 0) {
          const seenKeys = new Set();
          const uniqueVerts = [];
          for (let i = 0; i < posAttr.count; i++) {
            const vx = posAttr.getX(i);
            const vy = posAttr.getY(i);
            const vz = posAttr.getZ(i);
            const key = `${vx.toFixed(2)},${vy.toFixed(2)},${vz.toFixed(2)}`;
            if (!seenKeys.has(key)) {
              seenKeys.add(key);
              uniqueVerts.push(new THREE.Vector3(vx, vy, vz));
            }
          }

          const maxNodes = Math.min(uniqueVerts.length, 48);
          const nodeRadius = Math.max(0.07, r * 0.0425);
          const nodeGeo = new THREE.SphereGeometry(nodeRadius, 8, 8);
          const nodeMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });

          for (let i = 0; i < maxNodes; i++) {
            const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
            nodeMesh.position.copy(uniqueVerts[i]);
            latticeGroup.add(nodeMesh);
          }
        }

        return latticeGroup;
      }

      function createGeometricSurfaceTexture(planetOrStar, isStar = false) {
        if (typeof document === 'undefined' || !isThreeAvailable()) return null;
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');
          if (!ctx) return null;

          const baseColor = String(planetOrStar.color || (isStar ? '#f59e0b' : '#38bdf8'));
          ctx.fillStyle = baseColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const seedStr = String((planetOrStar && (planetOrStar.id || planetOrStar.name)) || 'stone');
          let seed = 2166136261 >>> 0;
          for (let i = 0; i < seedStr.length; i++) {
            seed ^= seedStr.charCodeAt(i);
            seed = Math.imul(seed, 16777619) >>> 0;
          }
          const rand = () => {
            seed ^= seed << 13;
            seed ^= seed >>> 17;
            seed ^= seed << 5;
            return ((seed >>> 0) % 10000) / 10000;
          };

          if (isStar) {
            for (let i = 0; i < 300; i++) {
              const gx = rand() * canvas.width;
              const gy = rand() * canvas.height;
              const gr = 3 + rand() * 15;
              const bright = rand() > 0.4;
              ctx.fillStyle = bright
                ? `rgba(255, 251, 235, ${(0.1 + rand() * 0.2).toFixed(2)})`
                : `rgba(124, 45, 18, ${(0.12 + rand() * 0.2).toFixed(2)})`;
              ctx.beginPath();
              ctx.arc(gx, gy, gr, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          const tex = new THREE.CanvasTexture(canvas);
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.needsUpdate = true;
          return tex;
        } catch (err) {
          return null;
        }
      }

      function rebuild3DScene() {
        if (!isThreeAvailable() || !viewport.scene) return;

        const disposeObject3D = (obj) => {
          if (!obj) return;
          const disposedGeometries = new Set();
          const disposedMaterials = new Set();
          obj.traverse((child) => {
            if (child.geometry && typeof child.geometry.dispose === 'function' && !disposedGeometries.has(child.geometry)) {
              disposedGeometries.add(child.geometry);
              child.geometry.dispose();
            }
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((mat) => {
              if (!mat || disposedMaterials.has(mat)) return;
              disposedMaterials.add(mat);
              if (mat.map && typeof mat.map.dispose === 'function') {
                mat.map.dispose();
              }
              if (typeof mat.dispose === 'function') {
                mat.dispose();
              }
            });
          });
        };

        viewport.starMeshes.forEach((entry) => {
          if (entry && entry.group) {
            viewport.scene.remove(entry.group);
            disposeObject3D(entry.group);
          }
        });
        viewport.starMeshes.clear();

        viewport.planetMeshes.forEach((entry) => {
          if (!entry) return;
          if (entry.group) {
            viewport.scene.remove(entry.group);
            disposeObject3D(entry.group);
          }
          if (entry.orbitLine) {
            viewport.scene.remove(entry.orbitLine);
            disposeObject3D(entry.orbitLine);
          }
        });
        viewport.planetMeshes.clear();

        appState.data.stars.forEach((star) => {
          const group = new THREE.Group();
          const r = Number(star.radius || 14);
          const colorHex = new THREE.Color(star.color || '#f59e0b');

          const spinAxisGroup = new THREE.Group();
          const childPlanets = getPlanetsForStar(star.id);
          let sumTiltX = 0;
          let sumTiltZ = 0;
          let tiltCount = 0;
          childPlanets.forEach((p) => {
            const tx = Number(p.orbitTiltX || 0);
            const tz = Number(p.orbitTiltZ || 0);
            if (tx !== 0 || tz !== 0) {
              sumTiltX += tx;
              sumTiltZ += tz;
              tiltCount += 1;
            }
          });
          const avgTiltX = tiltCount > 0 ? sumTiltX / tiltCount : 0;
          const avgTiltZ = tiltCount > 0 ? sumTiltZ / tiltCount : 0;
          spinAxisGroup.rotation.order = 'ZYX';
          spinAxisGroup.rotation.x = avgTiltX;
          spinAxisGroup.rotation.z = avgTiltZ;
          group.add(spinAxisGroup);

          // クリック判定用の透明コア球体
          const coreGeo = new THREE.SphereGeometry(r * 1.05, 24, 18);
          const coreMat = new THREE.MeshBasicMaterial({ visible: false });
          const core = new THREE.Mesh(coreGeo, coreMat);
          core.userData = { kind: 'star', id: star.id };
          spinAxisGroup.add(core);

          // 網目状球体（緯度経度ワイヤーフレーム＋内層メッシュ＋頂点ノード）
          const meshSphereGroup = new THREE.Group();
          const outerWireGeo = new THREE.SphereGeometry(r, 24, 16);
          const outerWireMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            wireframe: true,
            transparent: true,
            opacity: 0.85
          });
          const outerWireMesh = new THREE.Mesh(outerWireGeo, outerWireMat);
          outerWireMesh.userData = { kind: 'star', id: star.id };
          meshSphereGroup.add(outerWireMesh);

          const edgesGeo = new THREE.EdgesGeometry(new THREE.SphereGeometry(r * 1.005, 16, 12));
          const edgesMat = new THREE.LineBasicMaterial({
            color: 0xfef08a,
            transparent: true,
            opacity: 0.45
          });
          meshSphereGroup.add(new THREE.LineSegments(edgesGeo, edgesMat));

          const innerWireGeo = new THREE.SphereGeometry(r * 0.66, 14, 10);
          const innerWireMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            wireframe: true,
            transparent: true,
            opacity: 0.36
          });
          const innerWireMesh = new THREE.Mesh(innerWireGeo, innerWireMat);
          meshSphereGroup.add(innerWireMesh);

          const nodeGeo = new THREE.SphereGeometry(Math.max(0.12, r * 0.0225), 8, 8);
          const nodeMat = new THREE.MeshBasicMaterial({ color: 0xfffbeb });
          const ringCount = 6;
          const perRing = 12;
          for (let i = 1; i < ringCount; i++) {
            const phiNode = (i / ringCount) * Math.PI;
            const sinP = Math.sin(phiNode);
            const cosP = Math.cos(phiNode);
            for (let j = 0; j < perRing; j++) {
              const thetaNode = (j / perRing) * Math.PI * 2;
              const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
              nodeMesh.position.set(
                r * sinP * Math.cos(thetaNode),
                r * cosP,
                r * sinP * Math.sin(thetaNode)
              );
              meshSphereGroup.add(nodeMesh);
            }
          }
          spinAxisGroup.add(meshSphereGroup);

          const haloGeo = new THREE.SphereGeometry(r * 1.24, 20, 14);
          const haloMat = new THREE.MeshBasicMaterial({
            color: colorHex,
            wireframe: true,
            transparent: true,
            opacity: 0.16,
            depthWrite: false
          });
          const halo = new THREE.Mesh(haloGeo, haloMat);
          spinAxisGroup.add(halo);

          const outerAuraGeo = new THREE.RingGeometry(r * 1.32, r * 1.4, 64);
          const outerAuraMat = new THREE.MeshBasicMaterial({
            color: 0xfef08a,
            side: THREE.DoubleSide,
            wireframe: true,
            transparent: true,
            opacity: 0.42
          });
          const outerAura = new THREE.Mesh(outerAuraGeo, outerAuraMat);
          outerAura.rotation.x = Math.PI / 2;
          spinAxisGroup.add(outerAura);

          const ringGeo = new THREE.RingGeometry(r * 1.48, r * 1.62, 64);
          const ringMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            side: THREE.DoubleSide,
            wireframe: true,
            transparent: true,
            opacity: 0.92
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          ring.visible = appState.data.selectedKind === 'star' && appState.data.selectedId === star.id;
          spinAxisGroup.add(ring);

          const pos = star.position || { x: 0, y: 0, z: 0 };
          group.position.set(pos.x || 0, pos.y || 0, pos.z || 0);
          viewport.scene.add(group);
          viewport.starMeshes.set(star.id, { group, spinAxisGroup, core, meshSphereGroup, innerWireMesh, halo, ring });
        });

        appState.data.planets.forEach((planet) => {
          const star = getStarById(planet.starId) || appState.data.stars[0];
          const center = star && star.position ? star.position : { x: 0, y: 0, z: 0 };
          const r = Number(planet.radius || 3.8);
          const orbitR = Number(planet.orbitRadius || 40);
          const colorHex = new THREE.Color(planet.color || '#38bdf8');

          const group = new THREE.Group();
          const hitGeo = new THREE.SphereGeometry(r * 1.15, 16, 12);
          const hitMat = new THREE.MeshBasicMaterial({ visible: false });
          const body = new THREE.Mesh(hitGeo, hitMat);
          body.userData = { kind: 'planet', id: planet.id };
          group.add(body);

          const latticeGroup = buildMeshLatticeObject3D(planet, r, colorHex);
          group.add(latticeGroup);

          const selGeo = new THREE.RingGeometry(r * 1.38, r * 1.54, 48);
          const selMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            side: THREE.DoubleSide,
            wireframe: true,
            transparent: true,
            opacity: 0.95
          });
          const selRing = new THREE.Mesh(selGeo, selMat);
          selRing.rotation.x = Math.PI / 2;
          selRing.visible = appState.data.selectedKind === 'planet' && appState.data.selectedId === planet.id;
          group.add(selRing);

          if (planet.id === 'planet-saturn' || Boolean(planet.hasRing)) {
            const saturnRingGeo = new THREE.RingGeometry(r * 1.32, r * 2.25, 48);
            const saturnRingMat = new THREE.MeshBasicMaterial({
              color: planet.id === 'planet-saturn' ? 0xfde047 : colorHex,
              side: THREE.DoubleSide,
              wireframe: true,
              transparent: true,
              opacity: 0.78,
              depthWrite: false
            });
            const saturnRing = new THREE.Mesh(saturnRingGeo, saturnRingMat);
            saturnRing.rotation.x = Math.PI * 0.42;
            saturnRing.rotation.y = 0.22;
            group.add(saturnRing);
          }

          const segments = 128;
          const pts = [];
          const tiltX = Number(planet.orbitTiltX || 0);
          const tiltZ = Number(planet.orbitTiltZ || 0);
          const cosX = Math.cos(tiltX);
          const sinX = Math.sin(tiltX);
          const cosZ = Math.cos(tiltZ);
          const sinZ = Math.sin(tiltZ);

          for (let i = 0; i <= segments; i++) {
            const a = (i / segments) * Math.PI * 2;
            let lx = Math.cos(a) * orbitR;
            let ly = 0;
            let lz = Math.sin(a) * orbitR;

            if (tiltX !== 0) {
              const ny = ly * cosX - lz * sinX;
              const nz = ly * sinX + lz * cosX;
              ly = ny;
              lz = nz;
            }
            if (tiltZ !== 0) {
              const nx = lx * cosZ - ly * sinZ;
              const ny = lx * sinZ + ly * cosZ;
              lx = nx;
              ly = ny;
            }

            pts.push(
              new THREE.Vector3(
                (center.x || 0) + lx,
                (center.y || 0) + ly,
                (center.z || 0) + lz
              )
            );
          }
          const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
          const isSelected = appState.data.selectedKind === 'planet' && appState.data.selectedId === planet.id;
          const orbitMat = new THREE.LineBasicMaterial({
            color: isSelected ? 0x38bdf8 : 0x3f3f46,
            transparent: true,
            opacity: isSelected ? 0.85 : 0.42
          });
          const orbitLine = new THREE.Line(orbitGeo, orbitMat);
          viewport.scene.add(orbitLine);
          viewport.scene.add(group);

          viewport.planetMeshes.set(planet.id, { group, body, latticeGroup, selRing, orbitLine });
        });
      }

      function clampVal(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function update3DTransforms(dt) {
        if (!isThreeAvailable() || !viewport.camera) return;

        if (!appState.data.orbitPaused) {
          viewport.elapsedOrbitTime += dt;
        }

        appState.data.stars.forEach((star, idx) => {
          const entry = viewport.starMeshes.get(star.id);
          if (!entry) return;
          const pos = star.position || { x: 0, y: 0, z: 0 };
          entry.group.position.set(pos.x || 0, pos.y || 0, pos.z || 0);
          if (idx === 0 && viewport.sunLight) {
            viewport.sunLight.position.set(pos.x || 0, pos.y || 0, pos.z || 0);
          }

          const childPlanets = getPlanetsForStar(star.id);
          let sumTiltX = 0;
          let sumTiltZ = 0;
          let tiltCount = 0;
          childPlanets.forEach((p) => {
            const tx = Number(p.orbitTiltX || 0);
            const tz = Number(p.orbitTiltZ || 0);
            if (tx !== 0 || tz !== 0) {
              sumTiltX += tx;
              sumTiltZ += tz;
              tiltCount += 1;
            }
          });
          const targetTiltX = tiltCount > 0 ? sumTiltX / tiltCount : 0;
          const targetTiltZ = tiltCount > 0 ? sumTiltZ / tiltCount : 0;
          if (entry.spinAxisGroup) {
            entry.spinAxisGroup.rotation.order = 'ZYX';
            entry.spinAxisGroup.rotation.x = targetTiltX;
            entry.spinAxisGroup.rotation.z = targetTiltZ;
          }

          entry.core.rotation.y += dt * 0.35;
          if (entry.meshSphereGroup) {
            entry.meshSphereGroup.rotation.y += dt * 0.32;
          }
          if (entry.innerWireMesh) {
            entry.innerWireMesh.rotation.x -= dt * 0.45;
            entry.innerWireMesh.rotation.z += dt * 0.25;
          }
          entry.halo.rotation.y -= dt * 0.22;
          entry.halo.rotation.x += dt * 0.14;
          const isSel = appState.data.selectedKind === 'star' && appState.data.selectedId === star.id;
          entry.ring.visible = isSel;
          if (isSel) entry.ring.rotation.z += dt * 0.8;
        });

        appState.data.planets.forEach((planet) => {
          const entry = viewport.planetMeshes.get(planet.id);
          if (!entry) return;
          const pos = getPlanetWorldPosition(planet, viewport.elapsedOrbitTime);
          entry.group.position.set(pos.x, pos.y, pos.z);
          if (entry.latticeGroup) {
            entry.latticeGroup.rotation.y += dt * 0.9;
            entry.latticeGroup.rotation.x += dt * 0.35;
          }
          const isSel = appState.data.selectedKind === 'planet' && appState.data.selectedId === planet.id;
          entry.selRing.visible = isSel;
          if (isSel) entry.selRing.rotation.z += dt * 1.2;
        });

        if (appState.data.lockedTarget) {
          if (appState.data.lockedTarget.kind === 'star') {
            const s = getStarById(appState.data.lockedTarget.id);
            if (s && s.position) {
              viewport.cameraTarget.x += ((s.position.x || 0) - viewport.cameraTarget.x) * 0.14;
              viewport.cameraTarget.y += ((s.position.y || 0) - viewport.cameraTarget.y) * 0.14;
              viewport.cameraTarget.z += ((s.position.z || 0) - viewport.cameraTarget.z) * 0.14;
            }
          } else if (appState.data.lockedTarget.kind === 'planet') {
            const p = getPlanetById(appState.data.lockedTarget.id);
            if (p) {
              const pos = getPlanetWorldPosition(p, viewport.elapsedOrbitTime);
              viewport.cameraTarget.x += (pos.x - viewport.cameraTarget.x) * 0.16;
              viewport.cameraTarget.y += (pos.y - viewport.cameraTarget.y) * 0.16;
              viewport.cameraTarget.z += (pos.z - viewport.cameraTarget.z) * 0.16;
            }
          }
        }

        const r = clampVal(Number(viewport.cameraSpherical.radius) || BASE_DISTANCE, 25, 1800);
        const phi = clampVal(Number(viewport.cameraSpherical.phi) || Math.PI * 0.36, 0.12, Math.PI - 0.12);
        const theta = Number(viewport.cameraSpherical.theta) || 0.25;

        const sinPhi = Math.sin(phi);
        viewport.camera.position.set(
          viewport.cameraTarget.x + r * sinPhi * Math.sin(theta),
          viewport.cameraTarget.y + r * Math.cos(phi),
          viewport.cameraTarget.z + r * sinPhi * Math.cos(theta)
        );
        viewport.camera.lookAt(viewport.cameraTarget.x, viewport.cameraTarget.y, viewport.cameraTarget.z);

        if (viewport.starfield) {
          viewport.starfield.rotation.y += dt * 0.012;
        }
        if (viewport.geoGridGroup) {
          viewport.geoGridGroup.rotation.y -= dt * 0.03;
        }
      }

      function drawPolygonPath(ctx, cx, cy, radius, sides, angleOffset = 0) {
        const count = Math.max(3, sides || 5);
        ctx.beginPath();
        for (let i = 0; i < count; i++) {
          const a = angleOffset + (i / count) * Math.PI * 2;
          const px = cx + Math.cos(a) * radius;
          const py = cy + Math.sin(a) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function render2DCanvas() {
        const canvas = viewport.canvas2D;
        const ctx = viewport.ctx2D;
        if (!canvas || !ctx) return;

        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const bgGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 20, w * 0.5, h * 0.45, Math.max(w, h) * 0.7);
        bgGrad.addColorStop(0, '#09090b');
        bgGrad.addColorStop(1, '#000000');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        const dist = clampVal(Number(viewport.cameraSpherical.radius) || BASE_DISTANCE, 25, 1800);
        const zoomScale = BASE_DISTANCE / dist;
        const cxBase = w * 0.5 + (viewport.pan2D.x || 0);
        const cyBase = h * 0.5 + (viewport.pan2D.y || 0);

        const toScreen = (wx, wz) => ({
          x: cxBase + wx * zoomScale,
          y: cyBase + wz * zoomScale
        });

        viewport.projectedHitTargets = [];

        appState.data.planets.forEach((planet) => {
          const star = getStarById(planet.starId) || appState.data.stars[0];
          const center = star && star.position ? star.position : { x: 0, y: 0, z: 0 };
          const scCenter = toScreen(center.x || 0, center.z || 0);
          const rPx = Number(planet.orbitRadius || 40) * zoomScale;
          const isSel = appState.data.selectedKind === 'planet' && appState.data.selectedId === planet.id;

          ctx.strokeStyle = isSel ? 'rgba(56, 189, 248, 0.72)' : 'rgba(63, 63, 70, 0.45)';
          ctx.lineWidth = isSel ? 1.6 : 1;
          ctx.beginPath();
          ctx.arc(scCenter.x, scCenter.y, Math.max(2, rPx), 0, Math.PI * 2);
          ctx.stroke();
        });

        appState.data.stars.forEach((star) => {
          const pos = star.position || { x: 0, y: 0, z: 0 };
          const sc = toScreen(pos.x || 0, pos.z || 0);
          const rPx = Math.max(13, Number(star.radius || 14) * zoomScale * 0.95);
          const isSel = appState.data.selectedKind === 'star' && appState.data.selectedId === star.id;
          const starColor = star.color || '#f59e0b';

          const glowGrad = ctx.createRadialGradient(sc.x, sc.y, rPx * 0.15, sc.x, sc.y, rPx * 1.55);
          glowGrad.addColorStop(0, starColor);
          glowGrad.addColorStop(0.6, 'rgba(245, 158, 11, 0.22)');
          glowGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(sc.x, sc.y, rPx * 1.55, 0, Math.PI * 2);
          ctx.fill();

          // 2D表示でも網目状の球体（経線・緯線メッシュ）を描画
          ctx.strokeStyle = starColor;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(sc.x, sc.y, rPx, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(254, 240, 138, 0.45)';
          ctx.lineWidth = 0.9;
          const latCount = 4;
          for (let i = 1; i < latCount; i++) {
            const vRatio = (i / latCount) * 2 - 1;
            const latY = sc.y + vRatio * rPx;
            const latHalfW = Math.sqrt(Math.max(0, rPx * rPx - (vRatio * rPx) * (vRatio * rPx)));
            ctx.beginPath();
            ctx.moveTo(sc.x - latHalfW, latY);
            ctx.lineTo(sc.x + latHalfW, latY);
            ctx.stroke();
          }

          const lonCount = 6;
          const rotPhase = viewport.elapsedOrbitTime * 0.45;
          for (let j = 0; j < lonCount; j++) {
            const lonAngle = rotPhase + (j / lonCount) * Math.PI;
            const rx = Math.max(1.2, Math.abs(Math.cos(lonAngle)) * rPx);
            ctx.beginPath();
            ctx.ellipse(sc.x, sc.y, rx, rPx, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.fillStyle = '#fafafa';
          ctx.font = '600 12px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(star.name, sc.x, sc.y + rPx + 18);

          viewport.projectedHitTargets.push({
            kind: 'star',
            id: star.id,
            x: sc.x,
            y: sc.y,
            hitRadius: Math.max(16, rPx + 6)
          });
        });

        appState.data.planets.forEach((planet) => {
          const pos = getPlanetWorldPosition(planet, viewport.elapsedOrbitTime);
          const sc = toScreen(pos.x, pos.z);
          const rPx = Math.max(6, Number(planet.radius || 3.8) * zoomScale * 1.15);
          const isSel = appState.data.selectedKind === 'planet' && appState.data.selectedId === planet.id;
          // 惑星ID/名前から 3角形〜12角形（sides = 3..12）を決定
          const seedStr = String((planet && (planet.id || planet.name)) || 'poly');
          let h = 2166136261 >>> 0;
          for (let k = 0; k < seedStr.length; k++) {
            h ^= seedStr.charCodeAt(k);
            h = Math.imul(h, 16777619) >>> 0;
          }
          const sides = 3 + (h % 10);

          if (planet.id === 'planet-saturn' || Boolean(planet.hasRing)) {
            ctx.save();
            ctx.translate(sc.x, sc.y);
            ctx.rotate(-0.28);
            ctx.strokeStyle = planet.id === 'planet-saturn' ? 'rgba(253, 224, 71, 0.75)' : (planet.color || '#38bdf8');
            ctx.lineWidth = Math.max(1.2, rPx * 0.16);
            const ringSegs = 24;
            for (let s = 0; s < ringSegs; s++) {
              const a0 = (s / ringSegs) * Math.PI * 2;
              const a1 = ((s + 0.65) / ringSegs) * Math.PI * 2;
              ctx.beginPath();
              ctx.ellipse(0, 0, rPx * 1.95, rPx * 0.58, 0, a0, a1);
              ctx.stroke();

              const midA = (a0 + a1) * 0.5;
              ctx.beginPath();
              ctx.moveTo(Math.cos(midA) * rPx * 1.32, Math.sin(midA) * rPx * 0.38);
              ctx.lineTo(Math.cos(midA) * rPx * 1.95, Math.sin(midA) * rPx * 0.58);
              ctx.stroke();
            }
            ctx.restore();
          }

          drawPolygonPath(ctx, sc.x, sc.y, rPx, sides, viewport.elapsedOrbitTime * 0.35);
          ctx.strokeStyle = planet.color || '#38bdf8';
          ctx.lineWidth = 1.6;
          ctx.stroke();

          drawPolygonPath(ctx, sc.x, sc.y, rPx * 0.62, sides, -viewport.elapsedOrbitTime * 0.5);
          ctx.strokeStyle = 'rgba(248, 250, 252, 0.5)';
          ctx.lineWidth = 1;
          ctx.stroke();

          if (isSel) {
            drawPolygonPath(ctx, sc.x, sc.y, rPx + 5, sides, viewport.elapsedOrbitTime * 0.35);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();

            const selRingSegs = 16;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
            ctx.lineWidth = 1;
            for (let g = 0; g < selRingSegs; g++) {
              const ga = viewport.elapsedOrbitTime * 0.8 + (g / selRingSegs) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(sc.x + Math.cos(ga) * (rPx * 1.15), sc.y + Math.sin(ga) * (rPx * 1.15));
              ctx.lineTo(sc.x + Math.cos(ga) * (rPx * 1.45), sc.y + Math.sin(ga) * (rPx * 1.45));
              ctx.stroke();
            }
          }

          ctx.fillStyle = '#e4e4e7';
          ctx.font = '500 11px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(planet.name, sc.x, sc.y + rPx + 15);

          viewport.projectedHitTargets.push({
            kind: 'planet',
            id: planet.id,
            x: sc.x,
            y: sc.y,
            hitRadius: Math.max(12, rPx + 5)
          });
        });
      }

      function renderLoop(now) {
        try {
          const currentNow = typeof now === 'number' ? now : performance.now();
          const dt = Math.min(0.05, Math.max(0.001, (currentNow - viewport.lastFrameTime) / 1000));
          viewport.lastFrameTime = currentNow;

          if (appState.data.viewMode === '3d' && viewport.renderer && viewport.scene && viewport.camera) {
            update3DTransforms(dt);
            viewport.renderer.render(viewport.scene, viewport.camera);
          } else {
            if (!appState.data.orbitPaused) {
              viewport.elapsedOrbitTime += dt;
            }
            render2DCanvas();
          }
        } catch (err) {
          try {
            if (!appState.data.orbitPaused) {
              viewport.elapsedOrbitTime += 0.016;
            }
            render2DCanvas();
          } catch (fallbackErr) {
            // Minimal fallback when 2D context is unavailable
          }
        }
        requestAnimationFrame(renderLoop);
      }

      function startRenderLoop() {
        if (viewport.loopStarted) return;
        viewport.loopStarted = true;
        viewport.lastFrameTime = performance.now();
        requestAnimationFrame(renderLoop);
      }

      function handleViewportResize() {
        const w = Math.max(320, (els.viewportContainer && els.viewportContainer.clientWidth) || window.innerWidth || 1024);
        const h = Math.max(240, (els.viewportContainer && els.viewportContainer.clientHeight) || window.innerHeight || 768);
        if (viewport.camera && viewport.renderer) {
          viewport.camera.aspect = w / h;
          viewport.camera.updateProjectionMatrix();
          viewport.renderer.setSize(w, h);
        }
        if (viewport.canvas2D) {
          viewport.canvas2D.width = w;
          viewport.canvas2D.height = h;
        }
      }

      function setCameraDistance(dist, persist = true) {
        const clamped = Math.min(1800, Math.max(25, Number(dist) || DEFAULT_CAMERA_DISTANCE));
        viewport.cameraSpherical.radius = clamped;
        appState.data.cameraDistance = clamped;
        syncZoomUI();
        if (persist) saveStateToLocalStorage(false);
      }

      function syncZoomUI() {
        const r = Number(viewport.cameraSpherical.radius) || DEFAULT_CAMERA_DISTANCE;
        if (els.cameraZoomRange) els.cameraZoomRange.value = String(Math.round(r));
        const pct = Math.max(14, Math.min(1700, Math.round((DEFAULT_CAMERA_DISTANCE / r) * 100)));
        if (els.cameraZoomPercent) els.cameraZoomPercent.textContent = `${pct}%`;
      }

      function updateLockStatusUI() {
        const lock = appState.data.lockedTarget;
        if (!lock) {
          if (els.lockStatusText) els.lockStatusText.textContent = '自由視点';
          return;
        }
        if (lock.kind === 'star') {
          const s = getStarById(lock.id);
          if (els.lockStatusText) els.lockStatusText.textContent = s ? `恒星ロック: ${s.name}` : '自由視点';
        } else {
          const p = getPlanetById(lock.id);
          if (els.lockStatusText) els.lockStatusText.textContent = p ? `惑星ロック: ${p.name}` : '自由視点';
        }
      }

      function selectEntity(kind, id, lockCamera = false, openInspector = false) {
        appState.data.selectedKind = kind;
        appState.data.selectedId = id;
        if (lockCamera) {
          appState.data.lockedTarget = { kind, id };
        }
        if (openInspector && els.inspectorPanel) {
          els.inspectorPanel.classList.remove('hidden');
        }
        rebuild3DScene();
        renderAllUI();
        saveStateToLocalStorage(false);
      }

      function openPlanetContent(planet) {
        if (!planet) return;
        const pType = normalizePlanetType(planet);
        if (pType === 'image') {
          openImageViewer(planet.id);
        } else {
          openDocEditor(planet.id);
        }
      }

      function hitTestAtClientPos(clientX, clientY) {
        if (!els.viewportContainer) return null;
        const rect = els.viewportContainer.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        if (appState.data.viewMode === '2d' || !viewport.camera || !viewport.raycaster) {
          for (let i = viewport.projectedHitTargets.length - 1; i >= 0; i--) {
            const t = viewport.projectedHitTargets[i];
            const dist = Math.hypot(x - t.x, y - t.y);
            if (dist <= t.hitRadius) return { kind: t.kind, id: t.id };
          }
          return null;
        }

        viewport.pointerNDC.x = (x / Math.max(1, rect.width)) * 2 - 1;
        viewport.pointerNDC.y = -(y / Math.max(1, rect.height)) * 2 + 1;
        viewport.raycaster.setFromCamera(viewport.pointerNDC, viewport.camera);

        const candidates = [];
        viewport.planetMeshes.forEach((entry) => {
          if (entry && entry.body) candidates.push(entry.body);
        });
        viewport.starMeshes.forEach((entry) => {
          if (entry && entry.core) candidates.push(entry.core);
        });

        const hits = viewport.raycaster.intersectObjects(candidates, false);
        if (hits.length > 0 && hits[0].object && hits[0].object.userData) {
          return { kind: hits[0].object.userData.kind, id: hits[0].object.userData.id };
        }
        return null;
      }

      function bindViewportEvents() {
        const container = els.viewportContainer;
        if (!container) return;

        onEl(container, 'pointerdown', (e) => {
          if (e.button === 2) {
            viewport.dragMode = 'pan';
          } else {
            viewport.dragMode = appState.data.viewMode === '2d' ? 'pan' : 'orbit';
          }
          viewport.isDragging = true;
          viewport.dragStart = { x: e.clientX, y: e.clientY };
          viewport.pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
          if (!viewport.isDragging) return;
          const dx = e.clientX - viewport.dragStart.x;
          const dy = e.clientY - viewport.dragStart.y;
          viewport.dragStart = { x: e.clientX, y: e.clientY };

          if (appState.data.viewMode === '2d') {
            appState.data.lockedTarget = null;
            updateLockStatusUI();
            viewport.pan2D.x += dx;
            viewport.pan2D.y += dy;
          } else if (viewport.dragMode === 'orbit') {
            viewport.cameraSpherical.theta -= dx * 0.0065;
            viewport.cameraSpherical.phi = clampVal(viewport.cameraSpherical.phi - dy * 0.0065, 0.12, Math.PI - 0.12);
          } else if (viewport.dragMode === 'pan') {
            appState.data.lockedTarget = null;
            updateLockStatusUI();
            const panScale = viewport.cameraSpherical.radius * 0.0016;
            viewport.cameraTarget.x -= dx * panScale;
            viewport.cameraTarget.y += dy * panScale;
          }
        });

        window.addEventListener('pointerup', (e) => {
          if (!viewport.isDragging) return;
          const moved = Math.hypot(e.clientX - viewport.pointerDownPos.x, e.clientY - viewport.pointerDownPos.y);
          viewport.isDragging = false;
          viewport.dragMode = null;

          if (moved < 6) {
            const hit = hitTestAtClientPos(e.clientX, e.clientY);
            if (hit) {
              selectEntity(hit.kind, hit.id, true, false);
            }
          }
        });

        onEl(container, 'dblclick', (e) => {
          const hit = hitTestAtClientPos(e.clientX, e.clientY);
          if (hit && hit.kind === 'planet') {
            const planet = getPlanetById(hit.id);
            if (planet) openPlanetContent(planet);
          } else if (hit && hit.kind === 'star') {
            selectEntity('star', hit.id, true, true);
          }
        });

        onEl(
          container,
          'wheel',
          (e) => {
            e.preventDefault();
            const factor = e.deltaY > 0 ? 1.1 : 0.9;
            setCameraDistance(viewport.cameraSpherical.radius * factor, true);
          },
          { passive: false }
        );

        onEl(container, 'contextmenu', (e) => e.preventDefault());
      }

      function getTypeBadge(type) {
        if (type === 'image') {
          return { icon: 'ph-image', color: 'text-pink-400', label: '画像' };
        }
        return { icon: 'ph-file-text', color: 'text-sky-400', label: '文書' };

        const normalizedType = normalizePlanetType(planet);
        if (appState.data.typeFilter !== 'all' && normalizedType !== appState.data.typeFilter) {
          return false;

        if (appState.searchQuery.trim() !== '') {
          const q = appState.searchQuery.trim().toLowerCase();
          return String(planet.name || '').toLowerCase().includes(q);

        return true;
